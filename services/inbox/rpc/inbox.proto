syntax = "proto3";

package inbox.v1;

option go_package = "go-video/services/inbox/rpc";

// 说明：inbox 是站内信（系统消息）领域的所有者服务，只提供 gRPC（无 .api），
// 遵循 AGENTS.md §3/§4：客户端入口在 gateway/app，本服务不返回数据库原始对象。
//
// 数据边界（AGENTS.md §5）：
//   - 本服务只写 go_video_inbox 库自己的表，不读 feed/social-graph/engagement 的表；
//     feed 的“动态未读”与 inbox 的“站内信未读”是两个不同域，各自计数。
//   - 上游互动/发布/开播数据只通过版本化领域事件（internal/consumer）进入本服务。
//   - 外部渠道（Push/短信/邮件）归 notification 服务，本服务只管站内收件箱。

// 空响应。
message EmptyReply {}

// 消息分类（与 inbox_message.category 一致）。
enum Category {
  CATEGORY_UNSPECIFIED = 0; // 未指定：查询语境表示“全部分类”
  CATEGORY_SYSTEM = 1;      // 系统通知（运营/审核/账号）
  CATEGORY_ENGAGEMENT = 2;  // 互动消息（点赞、收藏、关注、分享、@）
  CATEGORY_CONTENT = 3;     // 内容消息（投稿发布、版权目录下架）
  CATEGORY_LIVE = 4;        // 直播消息（开播、断流、下播）
}

// 消息载体类型。
enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;
  MSG_TYPE_TEXT = 1;  // 纯文本
  MSG_TYPE_LINK = 2;  // 文本 + 跳转（跳转信息放 extra JSON）
  MSG_TYPE_RICH = 3;  // 结构化富文本（渲染由客户端按 extra 决定）
}

// 收件状态。
enum ReadState {
  READ_STATE_UNSPECIFIED = 0;
  READ_STATE_UNREAD = 1;  // 未读
  READ_STATE_READ = 2;    // 已读
}

// Message 是站内信在“某个收件人视角”下的投影（不是数据库行本身）。
message Message {
  int64 msg_id = 1;         // 消息 ID
  Category category = 2;    // 分类
  MsgType msg_type = 3;     // 载体类型
  string title = 4;         // 标题
  string content = 5;       // 正文
  int64 sender_mid = 6;     // 发送方 mid（0 表示系统）
  string biz_type = 7;      // 业务类型（submission/comment/live_room/...）
  string biz_id = 8;        // 业务主键（字符串，跨域 ID 不建外键）
  string extra = 9;         // 扩展 JSON 文本（客户端渲染所需，不含敏感数据）
  int64 ctime = 10;         // 投递到收件箱的时间（Unix 秒）
  ReadState read_state = 11; // 该收件人的已读状态
}

// --- 发送 ---

// SendSystemMessageReq 由 operation/审核/账号等上游给单个或多个用户发站内信。
// 幂等：idempotency_key 必填，重复提交返回首次结果且不重复投递。
message SendSystemMessageReq {
  repeated int64 mids = 1;       // 接收人列表（单个用户传 1 个元素）
  string title = 2;              // 标题
  string content = 3;            // 正文
  Category category = 4;         // 分类，未指定按 CATEGORY_SYSTEM 处理
  MsgType msg_type = 5;          // 载体类型，未指定按 MSG_TYPE_TEXT 处理
  int64 sender_mid = 6;          // 发送方 mid，0 表示系统账号
  string biz_type = 7;           // 业务类型
  string biz_id = 8;             // 业务主键
  string extra = 9;              // 扩展 JSON 文本
  string idempotency_key = 10;   // 幂等键（必填，调用方保证唯一）
  int64 operator = 11;           // 运营管理员 mid，用于审计
  string trace_id = 12;          // 透传 trace_id
}

message SendSystemMessageReply {
  int64 msg_id = 1;        // 消息主体 ID
  int32 delivered = 2;     // 本次新投递的收件人数
  bool deduplicated = 3;   // true 表示命中幂等键，未重复写入
  int64 ctime = 4;         // 消息创建时间
}

// --- 查询 ---

// ListMessagesReq 收件箱分页。按 docs/api-and-events.md §2 采用 cursor 优先：
// cursor 为空表示第一页；next_cursor 为空表示没有更多数据。
message ListMessagesReq {
  int64 mid = 1;                  // 收件人
  Category category = 2;          // 分类过滤，CATEGORY_UNSPECIFIED 表示全部
  string cursor = 3;              // 上一页 next_cursor
  int32 ps = 4;                   // 每页大小，0 表示使用服务端默认值
  bool unread_only = 5;           // 只看未读
}

message ListMessagesReply {
  repeated Message list = 1;      // 按 ctime 倒序
  string next_cursor = 2;         // 空表示到底
  bool has_more = 3;
  int64 unread_total = 4;         // 该用户未读总数（含当前分类过滤后的值）
}

// --- 已读 ---

message MarkReadReq {
  int64 mid = 1;             // 收件人
  repeated int64 msg_ids = 2; // 待标记的消息 ID
}

message MarkReadReply {
  int32 changed = 1;  // 实际从未读变为已读的数量（重复调用为 0）
  int64 unread_total = 2; // 变更后的未读总数
}

message MarkAllReadReq {
  int64 mid = 1;             // 收件人
  Category category = 2;     // 分类，CATEGORY_UNSPECIFIED 表示全部
}

message MarkAllReadReply {
  int32 changed = 1;
  int64 unread_total = 2;
}

// --- 未读计数 ---

message GetUnreadCountReq {
  int64 mid = 1;
  bool force_recompute = 2; // true 时忽略 Redis，从 inbox_user_message 重算
}

message GetUnreadCountReply {
  int64 total = 1;
  map<int32, int64> by_category = 2; // category -> 未读数
  int64 mtime = 3;                   // 计数快照更新时间
}

// RecomputeUnread 从 inbox_user_message 重算未读并回写 DB 快照与 Redis，
// 是计数漂移的唯一修复入口（cron 或运营后台调用）。
message RecomputeUnreadReq {
  int64 mid = 1;
}

message RecomputeUnreadReply {
  int64 total = 1;
  map<int32, int64> by_category = 2;
}

// --- 删除 ---

// DeleteMessageReq 用户侧软删除：只改本人 inbox_user_message.del_state，
// 不影响同一消息其它收件人，也不删除消息主体。
message DeleteMessageReq {
  int64 mid = 1;
  repeated int64 msg_ids = 2;
}

message DeleteMessageReply {
  int32 changed = 1;
  int64 unread_total = 2;
}

// Inbox 站内信服务。
// 方法名表达领域动作，不暴露数据库 CRUD（docs/api-and-events.md §1.1）。
service Inbox {
  // 系统/运营向单个或多个用户投递站内信（同事务写主体与收件行）。
  rpc SendSystemMessage(SendSystemMessageReq) returns (SendSystemMessageReply);
  // 按分类分页拉取收件箱（cursor 优先）。
  rpc ListMessages(ListMessagesReq) returns (ListMessagesReply);
  // 幂等标记已读。
  rpc MarkRead(MarkReadReq) returns (MarkReadReply);
  // 幂等把某分类（或全部）标记已读。
  rpc MarkAllRead(MarkAllReadReq) returns (MarkAllReadReply);
  // 分类未读数（Redis 加速，缺失回落 DB 快照）。
  rpc GetUnreadCount(GetUnreadCountReq) returns (GetUnreadCountReply);
  // 从明细表重算未读并修复快照与 Redis。
  rpc RecomputeUnread(RecomputeUnreadReq) returns (RecomputeUnreadReply);
  // 用户侧软删除。
  rpc DeleteMessage(DeleteMessageReq) returns (DeleteMessageReply);
}
