syntax = "proto3";

package playback.v1;

option go_package = "go-video/services/playback/rpc";

// playback 服务：播放会话与播放授权（短期签名地址）的领域服务。
// 依据 AGENTS.md §5，playback 只拥有 playback_session/playback_progress/playback_outbox；
// 稿件、媒资、转码版本和版权窗口分别归 video/asset/transcode/rights，本服务不复制其主数据，
// 只记录"某用户对某个可播放版本发起过一次受控播放"这一事实。
// 依据 §6，签发地址必须是带过期时间的 CDN 防盗链地址，客户端不得拿到对象存储长期密钥。
// 媒资/转码结果由调用方（gateway/app）解析成 object_key 后传入，本服务只对它签名。

// 内容类型。
// 注意：编号与 rights 契约的 ContentType 不一致（rights 是 1=PGC、2=UGC），
// 跨服务调用必须经过 internal/repository 的显式映射函数，禁止 int32 直转。
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0; // 未指定
  CONTENT_TYPE_UGC = 1;          // UGC/PUGC 稿件（content_id=aid，vid=bvid）
  CONTENT_TYPE_PGC = 2;          // 版权内容的一集（content_id=episode_id）
}

// 客户端平台（AGENTS.md §1/§6：Android、iOS、HarmonyOS、桌面端；不支持小程序）。
enum Platform {
  PLATFORM_UNSPECIFIED = 0; // 未指定
  PLATFORM_ANDROID = 1;      // Android
  PLATFORM_IOS = 2;          // iOS
  PLATFORM_HARMONY = 3;      // HarmonyOS
  PLATFORM_DESKTOP = 4;      // 电脑客户端
}

// 播放会话状态（与 model 常量一致）。
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0; // 未指定
  SESSION_STATE_ACTIVE = 1;       // 有效（可回源）
  SESSION_STATE_EXPIRED = 2;      // 已过期（回源校验时发现超过 expire_at）
  SESSION_STATE_REVOKED = 3;      // 已撤销（版权撤回、风控处置）
}

// 空响应
message EmptyReply {}

// --- 签发播放地址 ---

message GetPlaybackTokenReq {
  ContentType content_type = 1; // 内容类型
  int64 content_id = 2;         // 内容 ID：UGC=aid、PGC=episode_id
  string vid = 3;               // UGC bvid（可选，仅排障与日志关联）
  // object_key 可播放版本的 CDN 相对路径（如 /ugc/12/34/56.m3u8），由调用方从
  // asset/transcode 解析后传入；playback 不读媒资表，只对它签名（AGENTS.md §5）。
  string object_key = 4;
  int64 mid = 5;                // 观看者用户 ID，0 表示游客
  Platform platform = 6;        // 客户端平台
  string app_version = 7;       // 客户端版本号
  string region = 8;            // 地区代码（PGC 必传，用于版权窗口校验）
  string request_id = 9;        // 幂等键：同一 request_id 重放返回同一会话
  string trace_id = 10;         // 调用方透传 trace_id
}

message GetPlaybackTokenReply {
  string session_id = 1;   // 播放会话 ID（ULID）
  string play_url = 2;     // 带 auth_key 的短期签名播放地址
  string auth_key = 3;     // 独立返回签名串，供边缘节点排障比对
  int64 expire_at = 4;     // 授权过期时间（Unix 秒，绝对时间）
  int64 ttl = 5;           // 建议客户端缓存秒数
  string key_id = 6;       // 签名 KeyID，便于 CDN 密钥轮换排障
}

// --- 边缘/网关回源校验 ---

message VerifyPlaybackTokenReq {
  string session_id = 1; // 播放会话 ID
  string uri = 2;        // 被请求的资源路径（auth_key 与其绑定）
  string auth_key = 3;   // 客户端携带的签名串：ts-rand-uid-md5hash
  string client_ip = 4;  // 回源节点/客户端 IP（仅日志脱敏使用，不落库、不入事件）
}

message VerifyPlaybackTokenReply {
  bool allow = 1;            // 是否放行
  int64 expire_at = 2;       // 会话过期时间（Unix 秒）
  string deny_reason = 3;    // 拒绝原因码：session_not_found/session_expired/
                            // bad_auth_format/sign_mismatch/auth_key_revoked/uri_mismatch
  int64 play_count = 4;      // 该内容累计播放计数（Redis，首次回源时 +1）
}

// --- 播放心跳 ---

message ReportHeartbeatReq {
  string session_id = 1;   // 播放会话 ID
  int64 position_ms = 2;   // 当前播放位置（毫秒）
  int64 duration_ms = 3;   // 内容总时长（毫秒）
  int32 buffer_count = 4;  // 累计卡顿次数
  int64 avg_bitrate = 5;   // 累计平均码率（bps）
  int32 last_error = 6;    // 最近一次播放错误码（0 表示无错误）
  string trace_id = 7;     // 调用方透传 trace_id
}

message ReportHeartbeatReply {
  string event_id = 1;    // 写入 outbox 的事件 ID（ULID），下游按此幂等
  int64 accepted_at = 2;  // 服务端受理时间（Unix 秒）
  int64 max_position_ms = 3; // 幂等落库后的最大播放位置（乱序心跳不回退进度）
}

// --- 会话详情（管理/排障） ---

message GetSessionReq {
  string session_id = 1; // 播放会话 ID
}

message PlaybackProgressInfo {
  int64 id = 1;             // 自增主键
  string session_id = 2;    // 会话 ID（唯一）
  int32 content_type = 3;   // 内容类型，参见 ContentType
  int64 content_id = 4;     // 内容 ID
  string vid = 5;           // UGC bvid
  int64 mid = 6;            // 观看者用户 ID
  int64 position_ms = 7;    // 服务端记录的最大播放位置（毫秒）
  int64 duration_ms = 8;    // 内容总时长（毫秒）
  int32 buffer_count = 9;   // 累计卡顿次数
  int64 avg_bitrate = 10;   // 累计平均码率（bps）
  int32 last_error = 11;    // 最近一次播放错误码
  int64 ctime = 12;         // 创建时间（Unix 秒）
  int64 mtime = 13;         // 修改时间（Unix 秒）
}

message PlaybackSessionInfo {
  string session_id = 1;    // 会话 ID
  int32 content_type = 2;   // 内容类型，参见 ContentType
  int64 content_id = 3;     // 内容 ID
  string vid = 4;           // UGC bvid
  int64 mid = 5;            // 观看者用户 ID（0 游客）
  int32 platform = 6;       // 客户端平台，参见 Platform
  string app_version = 7;   // 客户端版本号
  string region = 8;        // 地区代码
  string object_key = 9;    // 签名目标对象路径
  string uri = 10;          // 签名使用的 URI 路径（auth_key 与其绑定）
  string request_id = 11;   // 幂等键
  int64 expire_at = 12;     // 过期时间（Unix 秒）
  int32 state = 13;         // 会话状态，参见 SessionState
  string trace_id = 14;     // 签发时的 trace_id
  int64 ctime = 15;         // 创建时间（Unix 秒）
  int64 mtime = 16;         // 修改时间（Unix 秒）
}

message GetSessionReply {
  PlaybackSessionInfo session = 1;  // 会话主体（不存在时为 null）
  PlaybackProgressInfo progress = 2; // 该会话的播放进度（无心跳时为 null）
  // 同一观看者对该内容的最近一次进度（跨会话对比，用于排障"为什么没有从头播放"）。
  PlaybackProgressInfo latest_progress = 3;
}

// Playback 播放授权与播放会话服务。
// 依据 AGENTS.md §5/§6：PGC 必须经 rights 校验版权窗口；签发地址短期有效；
// 心跳只写本服务表 + Outbox，异步进入 event-collector/spm，不在请求线程更新播放量。
service Playback {
  // 签发短期防盗链播放地址并创建播放会话（request_id 幂等）
  rpc GetPlaybackToken(GetPlaybackTokenReq) returns (GetPlaybackTokenReply);
  // 边缘/网关回源校验 auth_key 与会话有效期，并按会话首次放行累加播放计数
  rpc VerifyPlaybackToken(VerifyPlaybackTokenReq) returns (VerifyPlaybackTokenReply);
  // 上报播放心跳：幂等更新进度，并在同一事务写 playback.heartbeat 事件（Outbox）
  rpc ReportHeartbeat(ReportHeartbeatReq) returns (ReportHeartbeatReply);
  // 查询播放会话与进度详情（管理后台/排障）
  rpc GetSession(GetSessionReq) returns (GetSessionReply);
}
