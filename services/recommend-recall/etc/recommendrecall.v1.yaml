Name: recommendrecall.v1.rpc
ListenOn: 0.0.0.0:8116
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: recommendrecall.v1.rpc

# 池快照缓存、版本指针缓存与召回结果缓存
# 键名固定为 CacheRedis：zrpc.RpcServerConf 内嵌了同名 Redis 字段（限流用），
# 业务缓存必须用 CacheRedis，否则配置加载报 "conflict key redis"。
CacheRedis:
  Host: 127.0.0.1:6379
  Type: node

# MySQL 主库 DSN（仅本地示例，生产从配置中心/Secret 注入）
DataSource: root:root@tcp(127.0.0.1:3306)/go_video_recommend_recall?charset=utf8mb4&parseTime=true&loc=Local

# 下游依赖（spm / feature-store / video / social-graph）本轮**不配置**：
# spm 与 feature-store 的 rpc 契约正在同批次实现，接线点在 internal/repository 的
# FeatureSource / VisibilitySource 接口（见 services/recommend-recall/README.md「待接线接口」）。
# 未接线时这两路读取稳定返回 `feature/visibility source not configured`，
# 在线召回据此降级为 DEGRADE_REASON_FEATURE_UNAVAILABLE，不会伪造空特征。
#
# 接线时在此追加（示例，勿手工粘贴未验证的 Endpoints）：
#   FeatureRPC:
#     Etcd:
#       Hosts: [127.0.0.1:2379]
#       Key: spm.v1.rpc
#     NonBlock: true

Recall:
  # ---- 在线召回规模（同时决定 GetRecallConfig 下发给网关/客户端的上限）----
  MaxCandidates: 400        # 单次召回总候选硬上限，超过直接报错
  DefaultLimit: 120         # 请求未带 limit 时的默认条数
  PerSourceMax: 120         # 单路最大条数，防止一路吃满预算
  # 开启的召回路（rpc Source 编号）：1 热门 2 关注 3 标签 4 协同 5 向量 6 冷启动
  # 4/5 依赖 spm 与 feature-store 特征，接线前保持关闭：开了也只会稳定降级
  EnabledSources:
  - 1
  - 2
  - 3
  - 6
  # 请求未指定 sources 时的默认组合（必须是 EnabledSources 子集）
  DefaultSources:
  - 1
  - 2
  - 6
  FallbackSource: 1         # 降级兜底路：推荐链路故障时出热门池
  ColdStartSource: 6        # 游客/无行为用户走冷启动池
  # 是否允许降级出数。false 时依赖故障直接返回错误，
  # 供压测与回放拿到"真实失败"而不是"看起来正常的降级"
  DegradeEnabled: true
  MaxSeedAids: 20           # 相似/协同召回种子 aid 上限
  MaxSeedTags: 20           # 标签召回种子上限
  MaxExcludeAids: 500       # 单次请求可排除 aid 上限
  BudgetMillis: 80          # 内部时间预算，超预算裁剪剩余召回路
  TTLSeconds: 30            # 正常结果建议缓存秒数；降级结果恒为 0
  PoolStaleSeconds: 1800    # 池超过该秒数无新版本即标记 stale（仍出数，但要告警）
  MaxReadyPools: 50         # GetRecallConfig 一次下发的已上线池数量上限

  # ---- 离线写入与运维路径 ----
  MaxBatchItems: 1000            # UpsertPoolItems 单次写入条数上限
  MaxVersionList: 100            # ListPoolVersions 条数上限
  MaxPoolSnapshotPage: 200       # GetPoolSnapshot 单页条数上限
  MaxRequestLogPage: 100         # ListRecallRequestLogs 单页条数上限
  MinKeepVersions: 2             # 清理时每个池至少保留的版本数（回滚窗口下限）
  PruneMaxRows: 2000             # PrunePoolVersions 单次删除行数上限
  RequestLogRetentionSeconds: 604800   # 召回审计日志保留期（cron 清理）
  IdempotencyLeaseSeconds: 300         # 写接口幂等键 PENDING 租约
  IdempotencyRetentionSeconds: 86400   # 幂等记录保留期（必须大于租约）

# 事件发布链路（recall_outbox → recall.pool.published.v1）。
# Enabled 必须保持 false：默认构建没链接队列发送端，置 true 会让进程启动即失败，
# 需要 `-tags recommendrecall_kafka` 构建后才可打开（见 internal/publisher/README 口径）。
# 这里没有 Username/Password/CaFile：go-queue v1.2.2 的 kq.NewPusher 不暴露鉴权/TLS 注入口。
# 也没有 Group/SubscribeTopics：本服务只生产事件，没有任何代码读队列。
Kafka:
  Enabled: false
  Brokers:
  - 127.0.0.1:9092
  PublishTopics:
  - recall.pool.published.v1          # 必须等于 model 的 event_type+schema_version 拼出的 topic，多写会被点名拒绝
  MaxRetries: 5                       # 单事件累计尝试上限（含首次），达到即 state=2(失败)
  RetryBackoffSec: 2                  # 退避基数：第 n 次失败后等 2 * 2^(n-1) 秒
  RetryMaxBackoffSec: 1800            # 退避上限（秒），不得小于 RetryBackoffSec
  PollIntervalSec: 2                  # 发布循环轮询间隔（进程启动时先立刻扫一轮）
  BatchLimit: 100                     # 单轮取到的到期事件数；不得超过 model.MaxOutboxBatch=1000
  SendTimeoutSec: 5                   # 单条投递超时，超时按一次失败计入退避（不算已投递）
