syntax = "proto3";

package recommendrecall.v1;

option go_package = "go-video/services/recommend-recall/rpc";

// recommend-recall：多路召回领域服务（热门池 / 关注池 / 标签池 / 协同候选 / 向量候选）。
//
// 契约边界（AGENTS.md）：
//   - §7：召回只消费特征与池投影做候选，不提供广告位参数、不投放广告、不做商业化报表；
//     因此本契约**没有**任何"把某个 aid 手工顶到前面 / 加权 / 屏蔽某竞品"的写接口。
//     运营干预入口不在本服务（内容池准入由 operation + moderation 决定，见 README 待接线清单）。
//   - §5：候选只回传跨服务主键（aid）+ 来源标记 + 分数，不复制稿件、用户、媒资主数据；
//     稿件可见性、关系、已看事实分别归 video / social-graph / spm，本服务只读不写。
//   - §6：本服务是纯 gRPC 领域服务，面向端的响应聚合与响应信封由 gateway/app 负责。
//
// 可追溯性（本契约的核心设计）：
//   - 每个池由 (source, pool_key) 唯一寻址，pool_key 语法见 PoolRef 注释；
//   - 池条目按 version 分批写入，版本行登记 batch_id（生成批次）与 generator（产出方），
//     recall_pool_current 保存当前生效版本指针，切换/回滚都留审计；
//   - 在线召回结果逐条回带 pool_version + batch_id + snapshot_id，
//     并用 request_id 落在 recall_request_log，可用 GetRecallRequestLog 完整回放。
//
// 在线面红线：所有读方法都有条数上限；降级必须显式（DegradationInfo.degraded），
// 绝不返回"看起来正常但其实是空池"的成功。

// 空响应
message EmptyReply {}

// 客户端平台（AGENTS.md §1/§6：Android、iOS、HarmonyOS、电脑客户端；不支持小程序）。
// 编号与 playback/risk-control 等同仓契约保持一致，但本契约不 import 它们（proto 自包含）。
enum Platform {
  PLATFORM_UNSPECIFIED = 0; // 未指定
  PLATFORM_ANDROID = 1;     // Android
  PLATFORM_IOS = 2;         // iOS
  PLATFORM_HARMONY = 3;     // HarmonyOS
  PLATFORM_DESKTOP = 4;     // 电脑客户端
}

// 召回路 / 池类型。同一个枚举既用于池寻址（PoolRef.source），也用于候选来源标记，
// 保证池与候选用同一套词汇，不出现两套编号需要翻译（本仓 search-query 的反面教训）。
enum Source {
  SOURCE_UNSPECIFIED = 0;        // 未指定
  SOURCE_HOT = 1;               // 热门池（全局或分区）
  SOURCE_FOLLOW = 2;            // 关注池（关注作者近期稿件）
  SOURCE_TAG = 3;               // 标签/分区池
  SOURCE_COLLAB = 4;            // 协同过滤候选（i2i）
  SOURCE_VECTOR = 5;            // 向量近邻候选（u2i / i2i）
  SOURCE_COLD = 6;              // 冷启动池（新用户/未登录/无行为）
}

// 池版本状态（与 model.recall_pool_version.state 一致）。
enum PoolVersionState {
  POOL_VERSION_STATE_UNSPECIFIED = 0; // 未指定
  POOL_VERSION_STATE_BUILDING = 1;   // 写入中，不可被在线读
  POOL_VERSION_STATE_READY = 2;      // 写入完成并通过校验，等待切换
  POOL_VERSION_STATE_CURRENT = 3;    // 当前生效版本（每个池至多一个）
  POOL_VERSION_STATE_RETIRED = 4;    // 已退役（保留供回滚与回放）
  POOL_VERSION_STATE_FAILED = 5;     // 生成失败（不在线出数）
}

// 降级原因（与 model.DegradeReason* 一致）。0 表示未降级。
enum DegradeReason {
  DEGRADE_REASON_UNSPECIFIED = 0;        // 未降级（degraded=false 时恒为此值）
  DEGRADE_REASON_POOL_NOT_READY = 1;     // 目标池没有 CURRENT 版本或版本已过期
  DEGRADE_REASON_FEATURE_UNAVAILABLE = 2; // 特征/行为下游不可读（spm、feature-store）
  DEGRADE_REASON_DOWNSTREAM_TIMEOUT = 3; // 下游 RPC 超时或被熔断
  DEGRADE_REASON_STORE_UNAVAILABLE = 4;  // Redis/MySQL 不可用
  DEGRADE_REASON_BUDGET_EXHAUSTED = 5;   // 本服务内部时间预算耗尽，裁剪剩余召回路
  DEGRADE_REASON_COLD_START = 6;         // 冷启动走保底池（非故障，但需显式声明）
  DEGRADE_REASON_ALL_SOURCES_EMPTY = 7;  // 所有请求路都无候选（回兜底池或返回空并声明）
}

// 池寻址：source + pool_key 唯一定位一个池。pool_key 语法（受控，由 model.ValidatePoolKey 校验）：
//   SOURCE_HOT    -> "global" 或 "zone:<typeid>"
//   SOURCE_TAG    -> "tag:<tag_id>"
//   SOURCE_COLLAB -> "aid:<seed_aid>"
//   SOURCE_VECTOR -> "mid:<mid>"（用户向量近邻候选）
//   SOURCE_FOLLOW -> "mid:<mid>"
//   SOURCE_COLD   -> "platform:<platform>" 或 "global"
// 其它组合视为非法（ErrInvalidPoolKey），不接受调用方自由拼接的字符串键。
message PoolRef {
  Source source = 1;     // 召回路 / 池类型
  string pool_key = 2;   // 池键，语法见上
}

// 请求上下文（在线召回的身份与设备维度）。
// 只传主键与受控摘要：设备只传 sha256 摘要，明文设备号/手机号/IP 一律拒绝。
message RequestContext {
  int64 mid = 1;              // 当前用户 ID，0 表示游客/未登录（走冷启动）
  Platform platform = 2;      // 客户端平台（不写死任何端 UI 行为，只用于分池与过滤）
  string app_version = 3;     // 客户端版本号
  string device_id_hash = 4;  // 设备受控 ID 摘要（sha256 hex），空表示未知设备
  string region = 5;          // 地区代码（分区偏好与版权可见性用）
  string scene = 6;           // 场景稳定 key（如 home.feed / play.related），仅日志与配额维度
  string request_id = 7;      // 幂等与审计键；空则由服务端生成并在响应回传
  string trace_id = 8;        // 调用方透传 trace_id
}

// 单个候选（跨服务只传主键 + 来源 + 分数）。
message Candidate {
  int64 aid = 1;            // 稿件 ID（video 服务主键；本服务不落稿件数据）
  Source source = 2;        // 来源标记（去重合并后保留优先级最高的一路）
  int32 rank_in_source = 3; // 该路内序号（0 起）；排序服务不可用时按此回退召回原序
  double score = 4;         // 召回分（同路内可比的归一值，跨路不可比）
  int64 pool_version = 5;   // 产出该候选的池版本号（0 表示在线实时计算、无池快照）
  string batch_id = 6;      // 生成批次 ID（排障/回放；实时路可为空）
  repeated Source also_from = 7; // 去重合并时被合并掉的其他来源（可解释性）
}

// 每一路召回的取数统计（排障与监控用）。
message SourceStat {
  Source source = 1;       // 召回路
  int32 planned = 2;       // 计划取数条数
  int32 returned = 3;      // 实际返回条数
  int64 pool_version = 4;  // 实际读到的版本；0 表示没有可用 CURRENT 版本
  string batch_id = 5;     // 实际读到的批次
  bool degraded = 6;       // 该路是否降级/被丢弃
  string error_code = 7;   // 稳定错误 key（pool_not_ready/feature_unavailable/timeout/...）
}

// 降级声明：响应里必须能表达"这是降级结果"。
message DegradationInfo {
  bool degraded = 1;                        // 是否发生降级
  DegradeReason reason = 2;                 // 主原因
  repeated Source dropped_sources = 3;      // 被丢弃/未出数的请求路
  repeated Source served_sources = 4;       // 实际出数的路（降级后可能只剩兜底池）
  int32 cost_ms = 5;                        // 本次召回耗时（预算裁剪的排障依据）
  string detail = 6;                        // 排障文本，禁止包含用户敏感信息
}

// --- 在线召回 ---

message RecallCandidatesReq {
  RequestContext context = 1;
  repeated Source sources = 2;      // 指定召回路；空表示用服务默认组合
  int32 limit = 3;                  // 总候选条数上限（<= 配置 MaxCandidates），0 表示用默认
  repeated int64 seed_aids = 4;     // 相似/协同召回的种子稿件，上限 MaxSeedAids
  repeated int64 seed_tag_ids = 5;  // 标签召回的种子标签，上限 MaxSeedTags
  repeated int64 exclude_aids = 6;  // 调用方已知需排除的 aid（如已下发本页），上限 MaxExcludeAids
  bool allow_degrade = 7;           // false 时缺池/缺特征直接报错（压测与回放要求真实失败）
}

message RecallCandidatesReply {
  string request_id = 1;     // 回显（新请求时为服务端生成的 ID），与 recall_request_log 对应
  string snapshot_id = 2;    // 本次召回快照 ID，排序服务回填以便完整回放
  repeated Candidate candidates = 3;
  repeated SourceStat per_source = 4;
  DegradationInfo degradation = 5;
  int64 ttl_seconds = 6;     // 建议网关缓存秒数；降级结果固定 0（不建议缓存）
  int64 server_time = 7;     // 服务端时间（Unix 秒）
}

// --- 池快照运维/排障读 ---

message PoolItem {
  int64 aid = 1;          // 稿件 ID
  double score = 2;       // 池内分数
  int64 version = 3;      // 所属版本
  int64 ctime = 4;        // 写入时间（Unix 秒）
}

message GetPoolSnapshotReq {
  PoolRef pool = 1;
  int64 version = 2;   // 0 表示读 recall_pool_current 指向的 CURRENT 版本
  int32 pn = 3;        // 页码，1 起
  int32 ps = 4;        // 页大小，上限 MaxPoolSnapshotPage
}

message GetPoolSnapshotReply {
  PoolRef pool = 1;
  int64 version = 2;
  string batch_id = 3;
  PoolVersionState state = 4;
  int32 item_count = 5;      // 该版本总条数
  repeated PoolItem items = 6;
  bool has_more = 7;
  int64 published_at = 8;    // 切换生效时间（Unix 秒），未上线为 0
}

message PoolVersionInfo {
  PoolRef pool = 1;
  int64 version = 2;
  string batch_id = 3;
  string generator = 4;        // 产出方（cron job 名 / 离线作业 ID）
  int32 schema_version = 5;    // 池条目结构版本
  int32 item_count = 6;
  PoolVersionState state = 7;
  int64 published_at = 8;
  string operator = 9;
  string note = 10;
  int64 ctime = 11;
  int64 mtime = 12;
}

message ListPoolVersionsReq {
  PoolRef pool = 1;
  int32 limit = 2;           // 上限 MaxVersionList（默认 100）
  bool include_retired = 3;  // 是否包含已退役版本（回滚可行性检查）
}

message ListPoolVersionsReply {
  repeated PoolVersionInfo versions = 1;
  int64 current_version = 2;  // 当前生效版本，0 表示无 CURRENT（在线该池不出数）
}

// --- 召回请求审计回放 ---

message RecallRequestLogInfo {
  string request_id = 1;
  string snapshot_id = 2;
  int64 mid = 3;
  string scene = 4;
  Platform platform = 5;
  string app_version = 6;
  string region = 7;
  repeated Source requested_sources = 8;
  repeated SourceStat per_source = 9;
  int32 candidate_count = 10;
  int32 returned_count = 11;
  bool degraded = 12;
  DegradeReason reason = 13;
  int32 cost_ms = 14;
  string versions_digest = 15;  // sha256(读取到的 (source,version) 序列)，用于比对回放
  string trace_id = 16;
  int64 ctime = 17;
}

message GetRecallRequestLogReq {
  string request_id = 1;   // 与 snapshot_id 二选一，至少一个非空
  string snapshot_id = 2;
}

message GetRecallRequestLogReply {
  RecallRequestLogInfo entry = 1;   // 不存在时为 null（不返回空对象冒充命中）
}

message ListRecallRequestLogsReq {
  int64 mid = 1;           // 按用户查（0 表示不按用户过滤）
  string scene = 2;        // 按场景查
  int64 from_time = 3;     // Unix 秒，含
  int64 to_time = 4;       // Unix 秒，含
  int32 pn = 5;
  int32 ps = 6;            // 上限 MaxRequestLogPage
}

message ListRecallRequestLogsReply {
  repeated RecallRequestLogInfo entries = 1;
  bool has_more = 2;
}

// --- 离线池写入与版本切换（写接口全部带幂等键） ---

message UpsertPoolItemsReq {
  PoolRef pool = 1;
  int64 version = 2;             // 目标版本号：首批写入即登记 BUILDING 版本行；
                                // 同一 (pool, version) 只能属于一个 batch_id，跨批次复用版本号被拒绝
  string batch_id = 3;           // 生成批次 ID（可追溯）
  string generator = 4;          // 产出方标识
  int32 schema_version = 5;      // 条目结构版本，0 表示服务当前版本
  repeated PoolItemInput items = 6;  // 单次条数上限 MaxBatchItems
  string idempotency_key = 7;    // 幂等键：同 key 重放不重复写入（缺失直接拒绝）
  bool is_last_batch = 8;        // 该版本的最后一批，置为 READY
}

message PoolItemInput {
  int64 aid = 1;
  double score = 2;
}

message UpsertPoolItemsReply {
  int64 version = 1;
  int32 written = 2;          // 本次写入/更新的行数
  int32 item_count = 3;       // 该版本累计条数
  PoolVersionState state = 4; // 版本当前状态
  bool deduplicated = 5;      // true 表示 idempotency_key 命中重放
}

message PublishPoolVersionReq {
  PoolRef pool = 1;
  int64 version = 2;          // 目标版本（必须处于 READY）
  string operator = 3;        // 操作者（作业/运营标识），必填
  string reason = 4;          // 切换原因，必填（审计）
  string idempotency_key = 5; // 幂等键，必填
}

message PublishPoolVersionReply {
  bool switched = 1;           // 本次调用是否真的切换了指针
  int64 previous_version = 2;  // 切换前的 CURRENT
  int64 current_version = 3;   // 切换后的 CURRENT
  bool deduplicated = 4;
  string event_id = 5;         // recall.pool.published 事件 ID（outbox）
}

message RollbackPoolVersionReq {
  PoolRef pool = 1;
  int64 target_version = 2;    // 回滚到的历史版本（必须存在且已完成写入）
  string operator = 3;
  string reason = 4;           // 回滚原因，必填
  string idempotency_key = 5;
}

message RollbackPoolVersionReply {
  bool switched = 1;
  int64 previous_version = 2;
  int64 current_version = 3;
  bool deduplicated = 4;
  string event_id = 5;
}

message PrunePoolVersionsReq {
  PoolRef pool = 1;
  int32 keep_versions = 2;    // 每个池保留最近 N 个非 CURRENT 版本（>= MinKeepVersions）
  int64 max_rows = 3;         // 单次最多删除行数（保护锁与主从延迟）
  bool dry_run = 4;           // true 只统计不删除
  string operator = 5;
}

message PrunePoolVersionsReply {
  int32 scanned_versions = 1;
  int32 deleted_rows = 2;
  bool dry_run = 3;
  bool has_more = 4;          // true 表示还有可清理内容，调用方需继续分批
}

// --- 在线面参数下发（客户端/网关据此控制请求规模） ---

message GetRecallConfigReq {
  string scene = 1;      // 预留：场景级参数（当前返回服务级参数）
  int64 mid = 2;       // 0 表示游客（游客只允许冷启动/热门路）
}

message PoolStatus {
  PoolRef pool = 1;
  int64 current_version = 2;
  string batch_id = 3;
  int32 item_count = 4;
  int64 published_at = 5;
  bool stale = 6;        // 超过 PoolStaleSeconds 未更新（在线仍可读，但需要告警）
}

message GetRecallConfigReply {
  int32 max_candidates = 1;         // 单次召回总条数硬上限
  int32 default_limit = 2;          // 未指定 limit 时的默认条数
  int32 per_source_max = 3;         // 单路最大条数
  repeated Source enabled_sources = 4;  // 服务开启的召回路
  repeated Source default_sources = 5;  // 未指定 sources 时的默认组合
  int32 max_seed_aids = 6;
  int32 max_seed_tags = 7;
  int32 max_exclude_aids = 8;
  bool degrade_enabled = 9;         // 是否允许降级出数（关闭时依赖故障直接报错）
  Source fallback_source = 10;      // 兜底路（热门或关注池）
  int64 ttl_seconds = 11;           // 正常结果建议缓存秒数
  repeated PoolStatus ready_pools = 12;  // 当前有 CURRENT 版本的池摘要
}

// Recall 召回服务。
service Recall {
  // 多路召回主入口：按路取数 -> 过滤 -> 去重合并 -> 显式降级声明
  rpc RecallCandidates(RecallCandidatesReq) returns (RecallCandidatesReply);
  // 读某个池的某个版本条目（运维/排障，分页有上限）
  rpc GetPoolSnapshot(GetPoolSnapshotReq) returns (GetPoolSnapshotReply);
  // 列出版本与生成批次（可追溯性）
  rpc ListPoolVersions(ListPoolVersionsReq) returns (ListPoolVersionsReply);
  // 回放一次在线召回请求（按 request_id 或 snapshot_id）
  rpc GetRecallRequestLog(GetRecallRequestLogReq) returns (GetRecallRequestLogReply);
  // 分页查召回请求日志（运营/排障）
  rpc ListRecallRequestLogs(ListRecallRequestLogsReq) returns (ListRecallRequestLogsReply);
  // 分批写入池条目到指定版本（idempotency_key 幂等）
  rpc UpsertPoolItems(UpsertPoolItemsReq) returns (UpsertPoolItemsReply);
  // 原子切换池的当前生效版本（写审计 + 发事件）
  rpc PublishPoolVersion(PublishPoolVersionReq) returns (PublishPoolVersionReply);
  // 回滚到历史版本（运营回滚开关）
  rpc RollbackPoolVersion(RollbackPoolVersionReq) returns (RollbackPoolVersionReply);
  // 分批清理过期版本（由 services/cron 调用）
  rpc PrunePoolVersions(PrunePoolVersionsReq) returns (PrunePoolVersionsReply);
  // 下发在线召回参数与池健康摘要
  rpc GetRecallConfig(GetRecallConfigReq) returns (GetRecallConfigReply);
}
