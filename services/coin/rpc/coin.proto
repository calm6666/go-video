syntax = "proto3";

package coin.v1;

option go_package = "go-video/services/coin/rpc";

// 投币域契约（硬币 = 社区虚拟币，不是钱）。
//
// 数据所有权（§5）：本服务持有硬币余额、投币记录与每日额度；
// video/engagement 侧的 coin_count 只是投影，必须由本服务的事件或回算修正，
// 不允许别处直接改计数，也不允许与 payment 的现金余额互换（两套账）。
//
// 与商业化的关系：硬币的**获得**有两条路——运营发放（GrantCoin，需 reason）
// 和买硬币包（trade-order 履约时调 GrantCoin，biz_no 带订单号）；
// 硬币的**消耗**只有投币。全链路都不涉及真实资金。

// 空响应
message EmptyReply {}

// 流水类型
enum CoinFlowType {
  COIN_FLOW_TYPE_UNSPECIFIED = 0;
  COIN_FLOW_TYPE_TOSS = 1;         // 投币扣减（负）
  COIN_FLOW_TYPE_CANCEL_TOSS = 2;  // 取消投币退回（正）
  COIN_FLOW_TYPE_ORDER_PACK = 3;   // 硬币包履约发放（正）
  COIN_FLOW_TYPE_ADMIN_GRANT = 4;  // 运营发放或扣回（正负皆可）
  COIN_FLOW_TYPE_EXPIRE = 5;       // 预留：硬币过期（本项目未开启，恒不出现）
}

enum TossState {
  TOSS_STATE_UNSPECIFIED = 0;
  TOSS_STATE_ACTIVE = 1;
  TOSS_STATE_CANCELLED = 2;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_ANDROID = 1;
  PLATFORM_IOS = 2;
  PLATFORM_HARMONY = 3;
  PLATFORM_DESKTOP = 4;
  PLATFORM_WEB = 5;
}

// 投币被拒时的结论。与错误码分开：余额不足/超日限/超单片上限都是**业务结论**，
// 客户端要能据此决定文案与是否引导充值。
enum TossRejectReason {
  TOSS_REJECT_REASON_UNSPECIFIED = 0;
  TOSS_ACCEPTED = 1;
  TOSS_REJECT_INSUFFICIENT_BALANCE = 2;
  TOSS_REJECT_DAILY_LIMIT = 3;
  TOSS_REJECT_TARGET_LIMIT = 4;  // 单个内容累计已达上限
  TOSS_REJECT_TARGET_INVALID = 5; // aid 非正数（是否存在由 video 侧判定，不在这里越权查）
  TOSS_REJECT_SELF_TOSS = 6;      // 预留：作者给自己投币（需 social-graph 之外的作者身份，本轮不判定）
  TOSS_REJECT_RISK_BLOCKED = 7;   // 预留：风控拦截（risk-control 未接线，恒不出现）
  TOSS_REJECT_CANCEL_WINDOW_EXPIRED = 8; // 撤币窗口已过（不是限额问题，客户端要能区分文案）
}

message CoinAccountInfo {
  int64 mid = 1;
  int64 balance = 2;          // 当前可用硬币
  int64 total_tossed = 3;     // 累计投出（历史口径，不因取消而回退）
  int64 today_tossed = 4;     // 今日已投
  int64 today_limit = 5;      // 今日上限（服务侧配置投影）
  int64 per_target_limit = 6; // 单内容上限
  int64 cancel_window_seconds = 7; // 取消投币的时间窗
  int64 version = 8;
  int64 ctime = 9;
  int64 mtime = 10;
}

message TossInfo {
  int64 toss_id = 1;
  int64 mid = 2;
  int64 target_aid = 3;
  int32 count = 4;              // 该片累计投币数
  TossState state = 5;
  int64 first_tossed_at = 6;
  int64 last_tossed_at = 7;
  int64 cancelled_at = 8;
  string last_request_id = 9;
}

message CoinFlowInfo {
  int64 flow_id = 1;
  int64 mid = 2;
  CoinFlowType flow_type = 3;
  int64 delta = 4;              // 正入负出
  int64 balance_after = 5;
  int64 target_aid = 6;         // 投币类流水才有
  string biz_no = 7;            // 订单号/工单号
  string operator = 8;          // "user" / "trade-order" / 运营工号 / "cron"
  string request_id = 9;        // 幂等键（唯一索引）
  string remark = 10;           // 摘要，不含 PII
  int64 ctime = 11;
}

message TargetCoinSummary {
  int64 aid = 1;
  int64 coin_count = 2;        // 该片收到的硬币总数（按未取消的投币记录聚合）
  int64 coin_user_count = 3;   // 投币人数
  int64 like_count = 4;        // 恒为 0：点赞归 engagement，本服务不持有，留位是为了让调用方别去猜
}

// --- 账户与投币 ---

message GetCoinAccountReq {
  int64 mid = 1;
}

message GetCoinAccountReply {
  bool found = 1; // 从未有过硬币账户时 found=false 且 balance=0，不是错误
  CoinAccountInfo account = 2;
}

message TossCoinReq {
  int64 mid = 1;
  int64 target_aid = 2;
  int32 count = 3;      // 本次投几枚，<=0 视为 1；超单片上限由服务侧判定
  string request_id = 4; // 必填幂等键（同一 request_id 重放不重复扣币）
  Platform platform = 5;
  string client_trace_id = 6;
}

message TossCoinReply {
  bool accepted = 1;
  TossRejectReason reason = 2;
  bool duplicated = 3;      // 命中 request_id 重放
  CoinAccountInfo account = 4;
  TossInfo toss = 5;
  int64 flow_id = 6;
  string reject_detail = 7; // 可读结论（例如「今日还可投 2 枚」），不承载错误码语义
}

// 取消投币：全额退回该用户对该内容投出的硬币，记录置 CANCELLED。
// 只在 cancel_window_seconds 窗口内允许；超窗返回结论而不是静默成功。
message CancelTossReq {
  int64 mid = 1;
  int64 target_aid = 2;
  string request_id = 3;
  string operator = 4;   // 用户自助为 "user"；运营代操作填工号
  string reason = 5;     // 运营代操作必填
}

message CancelTossReply {
  bool cancelled = 1;
  TossRejectReason reason = 2;
  bool duplicated = 3;
  CoinAccountInfo account = 4;
  TossInfo toss = 5;
  int64 flow_id = 6;
  string reject_detail = 7; // 拒绝时给终端看的补充文案（与 TossCoinReply.reject_detail 同口径）
}

message ListMyTossesReq {
  int64 mid = 1;
  TossState state = 2;
  int64 page = 3;
  int64 size = 4;
}

message ListMyTossesReply {
  repeated TossInfo tosses = 1;
  int64 total = 2;
  int64 page = 3;
  int64 size = 4;
}

// --- 内容侧读取（详情页、列表页）---

message GetTargetSummaryReq {
  int64 aid = 1;
}

message GetTargetSummaryReply {
  TargetCoinSummary summary = 1;
}

message BatchGetTargetSummaryReq {
  reserved 1; // 曾计划放 trace_id，未启用；编号不复用
  repeated int64 aids = 2;
}

message BatchGetTargetSummaryReply {
  repeated TargetCoinSummary summaries = 1;
}

message ListTargetTossersReq {
  int64 target_aid = 1;
  int64 page = 2;
  int64 size = 3;
}

message ListTargetTossersReply {
  repeated TossInfo tosses = 1;
  int64 total = 2;
  int64 page = 3;
  int64 size = 4;
}

// --- 发放（运营/订单履约）---

// 单一发放入口：正数发放、负数扣回。必须带 reason 与 request_id。
// 订单履约调用时 operator="trade-order"、biz_no=订单号，便于对账时区分「白送的」和「买来的」。
message GrantCoinReq {
  int64 mid = 1;
  int64 delta = 2; // 不允许为 0
  CoinFlowType flow_type = 3; // 只接受 ORDER_PACK / ADMIN_GRANT
  string biz_no = 4;
  string operator = 5;
  string request_id = 6;
  string reason = 7; // ADMIN_GRANT 必填；ORDER_PACK 可空但建议带订单摘要
}

// GrantCoinReply 刻意不给 accepted/reason 结论通道：发放只由服务身份调用（订单履约、运营补币），
// 「会让余额变负」这类拒绝是调用方的编程错误而非用户可见结论，用 gRPC error 表达才不会让
// 调用方把它当成成功记账。终端可见的投币/撤币结论走 TossCoinReply/CancelTossReply 的 reason 枚举。
message GrantCoinReply {
  bool duplicated = 1;
  CoinAccountInfo account = 2;
  int64 flow_id = 3;
}

message ListCoinFlowsReq {
  int64 mid = 1; // 0 表示跨用户（运营面）
  CoinFlowType flow_type = 2;
  string biz_no = 3;
  int64 from_ts = 4;
  int64 to_ts = 5;
  int64 page = 6;
  int64 size = 7;
}

message ListCoinFlowsReply {
  repeated CoinFlowInfo flows = 1;
  int64 total = 2;
  int64 page = 3;
  int64 size = 4;
}

// 参数自述：日限/单片上限/取消窗口都来自服务端配置，
// 客户端不写死（§6），运营页也要能读到当前生效值。
message GetTossConfigReq {}

message GetTossConfigReply {
  int64 daily_limit = 1;
  int64 per_target_limit = 2;
  int64 cancel_window_seconds = 3;
  int64 min_balance_to_toss = 4;
  int64 initial_balance = 5; // 新建账户的初始硬币（沙箱便利，非真实赠送规则）
}

// Coin 硬币与投币服务。
service Coin {
  // 我的硬币账户（含今日额度）
  rpc GetCoinAccount(GetCoinAccountReq) returns (GetCoinAccountReply);
  // 投币（扣币 + 记录 + 限额判定，幂等）
  rpc TossCoin(TossCoinReq) returns (TossCoinReply);
  // 取消投币（窗口内全额退回）
  rpc CancelToss(CancelTossReq) returns (CancelTossReply);
  // 我的投币记录
  rpc ListMyTosses(ListMyTossesReq) returns (ListMyTossesReply);

  // 单内容投币汇总
  rpc GetTargetSummary(GetTargetSummaryReq) returns (GetTargetSummaryReply);
  // 列表页批量汇总
  rpc BatchGetTargetSummary(BatchGetTargetSummaryReq) returns (BatchGetTargetSummaryReply);
  // 谁投了这条内容（运营/排障）
  rpc ListTargetTossers(ListTargetTossersReq) returns (ListTargetTossersReply);

  // 发放/扣回硬币（运营授权或订单履约）
  rpc GrantCoin(GrantCoinReq) returns (GrantCoinReply);
  // 硬币流水台账分页
  rpc ListCoinFlows(ListCoinFlowsReq) returns (ListCoinFlowsReply);
  // 生效参数读取
  rpc GetTossConfig(GetTossConfigReq) returns (GetTossConfigReply);
}
