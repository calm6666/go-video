syntax = "proto3";

package openplatform.v1;

option go_package = "go-video/services/open-platform/rpc";

// 说明：open-platform 是第三方开放应用与授权领域的数据所有者，只提供 gRPC（无 .api），
// 遵循 AGENTS.md §3/§4：对外开放 HTTP 入口、签名校验编排和响应信封由 gateway 承担，
// 本服务提供授权判定、密钥/凭证生命周期、配额与回调投递，不返回数据库原始对象。
//
// 范围红线（AGENTS.md §1）：只开放明确的非商业化能力。scope 目录中不存在会员、订单、
// 支付、投币、分成、广告投放或广告位分析相关权限点，本服务也不提供这些接口位。
//
// 密钥与凭证（对齐 services/account 的凭证存储方式）：
//   - client_secret / authorization_code / access_token / refresh_token 一律只存哈希
//     （salt + HMAC-SHA256，服务端 pepper 来自 Secret/Vault，不入库、不入仓库）。
//   - 明文 secret 只在 RegisterApplication 与 RotateApplicationSecret 的响应中出现一次，
//     其余任何接口（含运营后台、列表、详情、日志）都不得回显，也不得写进事件 payload。
//   - account 的密码哈希沿用历史 MD5 以兼容 passport 客户端；本域没有历史包袱，
//     采用 salt + HMAC-SHA256(pepper, secret)，表结构仍与 account_secret 同形
//     （salt/hash/status 生效位/ctime/mtime，轮换把旧行置历史），差异在此显式记录。
//
// 授权与撤销：授权码短期一次性；refresh 可轮换、可撤销；access token 校验除自身状态外
// 还必须比对撤销位点 op_grant.revoked_at（grant 版本），保证“撤销立刻生效”，
// 即使 token 未被显式逐条标记也能在下次校验时被拒。
//
// 配额：op_quota_usage 是投影（应用 × 接口 × 时间窗计数），真值可由 op_api_call_log 重算
// （RecomputeQuota）；计数丢失只会短时放宽限额，不会破坏业务正确性。

// 空响应。
message EmptyReply {}

// 应用状态机（与 op_app.status 一致）。
// PENDING_REVIEW → ACTIVE/REJECTED；ACTIVE ↔ SUSPENDED；任意态 → OFFLINE（终态，需重新注册）。
enum AppStatus {
  APP_STATUS_UNSPECIFIED = 0;   // 未指定
  APP_STATUS_PENDING_REVIEW = 1; // 待运营审核
  APP_STATUS_ACTIVE = 2;        // 正常可用
  APP_STATUS_SUSPENDED = 3;     // 已停用（违规/风控），token 与配额全部拒绝
  APP_STATUS_REJECTED = 4;      // 审核驳回
  APP_STATUS_OFFLINE = 5;       // 已下线（终态）
}

// scope 读写属性（与 op_scope.access 一致）：每个权限点必须显式声明读或写。
enum ScopeAccess {
  SCOPE_ACCESS_UNSPECIFIED = 0; // 未指定：服务端拒绝注册该 scope
  SCOPE_ACCESS_READ = 1;        // 只读
  SCOPE_ACCESS_WRITE = 2;       // 写（必须再声明是否要求用户逐次同意）
}

// scope 风险级别（与 op_scope.risk_level 一致），决定授权页展示强度与是否可批量授予。
enum ScopeRiskLevel {
  SCOPE_RISK_LEVEL_UNSPECIFIED = 0;
  SCOPE_RISK_LEVEL_LOW = 1;     // 低：可默认勾选
  SCOPE_RISK_LEVEL_MEDIUM = 2;  // 中：需用户显式确认
  SCOPE_RISK_LEVEL_HIGH = 3;    // 高：需运营审批且不可批量授予
}

// 授权换取方式（与 op_token.grant_type 一致）。
enum GrantType {
  GRANT_TYPE_UNSPECIFIED = 0;
  GRANT_TYPE_AUTHORIZATION_CODE = 1; // 授权码换 token
  GRANT_TYPE_REFRESH_TOKEN = 2;      // refresh 轮换出的新 token
}

// token 状态（与 op_token.state 一致）。
enum TokenState {
  TOKEN_STATE_UNSPECIFIED = 0;
  TOKEN_STATE_ACTIVE = 1;   // 有效（仍需比对 grant 撤销位点）
  TOKEN_STATE_ROTATED = 2;  // 已被轮换替代（旧 refresh/access）
  TOKEN_STATE_REVOKED = 3;  // 已撤销
  TOKEN_STATE_EXPIRED = 4;  // 已过期（惰性归档）
}

// 撤销目标（RevokeAuthorization 使用）。
enum RevokeTarget {
  REVOKE_TARGET_UNSPECIFIED = 0; // 未指定：服务端拒绝
  REVOKE_TARGET_TOKEN = 1;       // 撤销单个 token（access 或 refresh）
  REVOKE_TARGET_GRANT = 2;       // 撤销“该用户对该应用”的全部授权
  REVOKE_TARGET_USER_ALL = 3;    // 撤销该用户的全部第三方授权（改密/风控一键下线）
}

// Webhook 事件类型（与 op_webhook_endpoint.event_type、op_webhook_delivery.event_type 一致）。
// 只包含内容/授权/配额类事件，不存在商业化事件。
enum WebhookEventType {
  WEBHOOK_EVENT_TYPE_UNSPECIFIED = 0;
  WEBHOOK_EVENT_TYPE_CONTENT_PUBLISH_RESULT = 1; // 第三方投稿转码/审核结果
  WEBHOOK_EVENT_TYPE_CONTENT_OFFLINE = 2;        // 内容下架、版权撤回
  WEBHOOK_EVENT_TYPE_GRANT_REVOKED = 3;          // 用户或平台撤销授权
  WEBHOOK_EVENT_TYPE_QUOTA_WARNING = 4;          // 配额接近上限告警
}

// Webhook 投递状态（与 op_webhook_delivery.state 一致）。
enum WebhookDeliveryState {
  WEBHOOK_DELIVERY_STATE_UNSPECIFIED = 0;
  WEBHOOK_DELIVERY_STATE_PENDING = 1;        // 待投递
  WEBHOOK_DELIVERY_STATE_DELIVERING = 2;     // 投递中（超时后可被抢占）
  WEBHOOK_DELIVERY_STATE_SUCCESS = 3;        // 成功（HTTP 2xx 且签名回执校验通过）
  WEBHOOK_DELIVERY_STATE_RETRY_SCHEDULED = 4; // 已排定退避重试
  WEBHOOK_DELIVERY_STATE_DEAD = 5;           // 死信（超过最大次数，等待人工重放）
  WEBHOOK_DELIVERY_STATE_IGNORED = 6;        // 人工忽略（终态）
}

// client_secret 状态（应用信息投影字段，绝不含密钥材料）。
enum SecretState {
  SECRET_STATE_UNSPECIFIED = 0;
  SECRET_STATE_CONFIGURED = 1; // 存在生效密钥
  SECRET_STATE_REVOKED = 2;    // 全部密钥已撤销，签名调用将被拒
  SECRET_STATE_UNSET = 3;      // 从未签发
}

// ApplicationInfo 应用投影。注意：没有 client_secret 字段。
message ApplicationInfo {
  int64 app_id = 1;              // 应用 ID（跨服务只传这个主键）
  string app_key = 2;            // 公开标识（签发后不可变）
  string name = 3;               // 应用名
  string description = 4;        // 应用简介
  int64 owner_mid = 5;           // 归属开发者 mid
  AppStatus status = 6;          // 状态
  repeated string redirect_uris = 7; // 授权回调白名单
  repeated string scopes = 8;    // 已获批 scope 列表
  SecretState secret_state = 9;  // 密钥状态（不回显密钥）
  int64 secret_rotated_at = 10;  // 最近一次轮换时间（Unix 秒）
  int32 version = 11;            // 乐观锁版本
  int64 ctime = 12;              // 创建时间
  int64 mtime = 13;              // 最近更新时间
  int64 offline_at = 14;         // 下线时间（0 表示未下线）
}

// ScopeInfo 权限点目录。
message ScopeInfo {
  string scope = 1;                // 权限点标识，如 video.publish
  string display_name = 2;         // 展示名（授权页文案）
  ScopeAccess access = 3;          // 读/写声明
  ScopeRiskLevel risk_level = 4;   // 风险级别
  bool requires_user_consent = 5;  // 是否需要用户逐次同意
  bool enabled = 6;                // 目录内是否开放
  string reason = 7;               // 停用原因
  int32 granted_state = 8;         // 请求方上下文中的应用获批状态：0 未申请、1 待审批、2 已获批
}

// TokenSet 一次性签发的令牌组（只在签发响应中出现，不进入任何查询接口）。
message TokenSet {
  string access_token = 1;   // 明文 access token（仅本次响应出现）
  string token_type = 2;     // 固定 Bearer
  int64 expires_in = 3;      // access 有效期（秒）
  string refresh_token = 4;  // 明文 refresh token（仅本次响应出现）
  int64 refresh_expires_in = 5; // refresh 有效期（秒）
  repeated string scope = 6; // 实际授予 scope（可能小于申请值）
  int64 grant_id = 7;        // 授权关系 ID（撤销位点锚点）
  int64 token_id = 8;        // op_token 行 ID
  int64 issued_at = 9;       // 签发时间（Unix 秒）
}

// --- 应用生命周期 ---

// RegisterApplicationReq 注册第三方应用。
// 幂等：client_token 必填，同 client_token 重试返回同一应用且不重复签发 secret。
message RegisterApplicationReq {
  string name = 1;               // 应用名
  string description = 2;        // 简介
  int64 owner_mid = 3;           // 开发者 mid（gateway 从会话注入）
  repeated string redirect_uris = 4; // 回调白名单，https only
  repeated string scopes = 5;    // 申请的 scope（未获批前不生效）
  string client_token = 6;       // 幂等键（必填）
  string trace_id = 7;
}

message RegisterApplicationReply {
  ApplicationInfo app = 1;
  string client_secret = 2;      // 明文密钥，仅本次返回，任何接口不再回显
  int64 secret_expires_at = 3;   // 密钥有效期（0 表示按配置长期有效）
  bool replayed = 4;             // true 表示命中 client_token，未新建应用且不再回显旧密钥
}

message GetApplicationReq {
  int64 app_id = 1;      // 与 app_key 二选一
  string app_key = 2;
  int64 caller_mid = 3;  // 调用者（owner 或运营）
  bool operator = 4;     // true 表示运营侧查询（可查非 ACTIVE 应用）
  string trace_id = 5;
}

message GetApplicationReply {
  ApplicationInfo app = 1;
}

// ListApplicationsReq 开发者看自己的应用；operator=true 时运营看全量。
message ListApplicationsReq {
  int64 owner_mid = 1;
  AppStatus status = 2;      // UNSPECIFIED 表示不过滤
  string cursor = 3;         // (mtime, app_id) 游标
  int32 ps = 4;
  bool operator = 5;         // 运营侧全量查询
  string trace_id = 6;
}

message ListApplicationsReply {
  repeated ApplicationInfo list = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// UpdateApplicationReq 修改资料或推进状态机。
// 并发：expected_version 不匹配返回 ErrConcurrentUpdate（状态版本双重防重，AGENTS.md §5）。
message UpdateApplicationReq {
  int64 app_id = 1;
  string name = 2;                  // 空串表示不修改
  string description = 3;
  repeated string redirect_uris = 4; // 空列表表示不修改
  AppStatus target_status = 5;      // UNSPECIFIED 表示不改状态
  int32 expected_version = 6;       // 乐观锁
  int64 operator_mid = 7;           // 状态推进必须是运营；资料修改必须是 owner
  bool is_operator = 8;
  string reason = 9;                // 状态变更原因（审计）
  string trace_id = 10;
}

message UpdateApplicationReply {
  ApplicationInfo app = 1;
  bool changed = 2;
}

// RotateApplicationSecretReq 轮换密钥：新密钥立即生效，旧密钥在 grace_seconds 后失效
// （宽限期内旧密钥仍可用以便应用平滑切换；grace_seconds=0 表示立即失效）。
// 响应一次性返回新明文 secret。
message RotateApplicationSecretReq {
  int64 app_id = 1;
  int64 operator_mid = 2;   // owner 或运营
  bool is_operator = 3;
  int64 grace_seconds = 4;  // 旧密钥宽限秒数，0 表示立即失效
  string reason = 5;        // 轮换原因（泄露/例行轮换，审计）
  string trace_id = 6;
}

message RotateApplicationSecretReply {
  string client_secret = 1;      // 新明文密钥，仅本次返回
  int64 secret_id = 2;           // 新密钥行 ID
  int64 old_secret_id = 3;       // 被替换的旧密钥行 ID（0 表示无）
  int64 old_secret_expires_at = 4; // 旧密钥失效时间（Unix 秒）
  int64 rotated_at = 5;
}

// RevokeApplicationSecretReq 紧急吊销密钥（怀疑泄露）：可指定单把或全部。
// 吊销后所有依赖 secret 的签名调用立即被拒，已签发的 token 不受影响
// （除非同时 RevokeAuthorization）。
message RevokeApplicationSecretReq {
  int64 app_id = 1;
  int64 secret_id = 2;      // 0 表示吊销该应用全部生效密钥
  int64 operator_mid = 3;
  bool is_operator = 4;
  string reason = 5;        // 审计原因，必填
  string trace_id = 6;
}

message RevokeApplicationSecretReply {
  int32 revoked = 1;
  int64 effective_at = 2;
}

// --- scope 目录与审批 ---

message ListScopesReq {
  int64 app_id = 1;      // 传入则返回该应用对每个 scope 的获批状态
  bool only_enabled = 2; // 只返回开放的 scope
  string trace_id = 3;
}

message ListScopesReply {
  repeated ScopeInfo list = 1;
}

// GrantApplicationScopesReq 运营审批 scope 授予/回收。回收立即生效，
// 并在受影响 token 的下次校验时因 scope 不足被拒（同时写撤销位点）。
message GrantApplicationScopesReq {
  int64 app_id = 1;
  repeated string grant = 2;   // 授予的 scope
  repeated string revoke = 3;  // 回收的 scope
  int64 operator_mid = 4;      // 运营，必填 > 0
  string reason = 5;
  string idempotency_key = 6;  // 幂等键
  string trace_id = 7;
}

message GrantApplicationScopesReply {
  repeated string granted = 1;
  repeated string revoked = 2;
  repeated string rejected = 3; // 目录中不存在或已停用的 scope
  int32 app_version = 4;
  bool replayed = 5;
}

// --- OAuth ---

// IssueAuthorizationCodeReq 已登录用户同意授权后由 gateway 调用签发授权码。
// consent_given 必须为 true（服务端不接受“隐式同意”）；scope 必须是应用已获批 scope 的子集。
// 授权码短期（AuthCodeTTLSeconds，默认 60s）且一次性消费。
message IssueAuthorizationCodeReq {
  int64 app_id = 1;
  int64 mid = 2;               // 授权用户（gateway 会话注入）
  repeated string scope = 3;   // 用户同意的 scope
  string redirect_uri = 4;     // 必须在应用白名单内
  string state = 5;            // 客户端 state，仅随响应回显
  bool consent_given = 6;      // 必须 true
  string trace_id = 7;
}

message IssueAuthorizationCodeReply {
  string code = 1;             // 授权码明文（仅经 gateway 302 回跳，不入库明文）
  int64 expires_in = 2;
  repeated string scope = 3;   // 实际授予
  int64 grant_id = 4;
}

// ExchangeAuthorizationCodeReq 授权码换 token：同一 code 二次消费返回 ErrAuthCodeUsed
// 并触发一次重放告警（记录调用方，便于发现泄露）。
message ExchangeAuthorizationCodeReq {
  int64 app_id = 1;
  string code = 2;
  string redirect_uri = 3;     // 与签发时一致性校验
  string trace_id = 4;
}

message ExchangeAuthorizationCodeReply {
  TokenSet token = 1;
}

// RefreshAccessTokenReq 轮换 refresh token：旧 refresh 立即置 ROTATED，
// 若旧值被再次使用则判定重放并撤销整条 grant（保守失效）。
message RefreshAccessTokenReq {
  int64 app_id = 1;
  string refresh_token = 2;
  repeated string scope = 3;   // 允许收窄，不允许扩大
  string trace_id = 4;
}

message RefreshAccessTokenReply {
  TokenSet token = 1;
  bool rotated = 2;            // 是否签发了新的 refresh_token
}

// RevokeAuthorizationReq 撤销授权（RFC 7009 语义）。
// 生效方式：写 op_grant.revoked_at 位点 + 逐条标记 op_token，双保险保证立即生效，
// 即使网关侧持有缓存的 token 校验结果也会在 TTL 到期后被位点拒绝。
message RevokeAuthorizationReq {
  RevokeTarget target = 1;
  int64 app_id = 2;            // TOKEN/GRANT 必填
  int64 mid = 3;               // GRANT/USER_ALL 必填
  int64 token_id = 4;          // TOKEN 必填（或传 token_hint）
  string token_hint = 5;       // access/refresh 明文（仅本次请求内使用，不日志）
  int64 operator_mid = 6;      // 用户本人或运营
  bool is_operator = 7;
  string reason = 8;           // 审计原因
  string trace_id = 9;
}

message RevokeAuthorizationReply {
  int32 grants_revoked = 1;
  int32 tokens_revoked = 2;
  int64 effective_at = 3;      // 撤销位点时间（Unix 秒）
}

// IntrospectTokenReq token 校验（gateway 鉴权中间件调用）。
// 校验顺序：token 行状态 → 过期时间 → grant 撤销位点 → 应用状态 → scope（若带 api_code）。
message IntrospectTokenReq {
  string access_token = 1;
  int64 token_id = 2;          // 已知 token_id 时可省 access_token
  string api_code = 3;         // 带接口标识时一并做 scope 判定
  string required_scope = 4;
  string trace_id = 5;
}

message IntrospectTokenReply {
  bool active = 1;
  int64 app_id = 2;
  int64 mid = 3;               // 0 表示应用级凭证（本期不签发）
  repeated string scope = 4;
  int64 expires_at = 5;
  int64 grant_id = 6;
  int64 token_id = 7;
  string deny_reason = 8;      // 拒绝原因码（inactive/expired/revoked/app_suspended/scope_missing）
}

// AuthorizeRequestReq 网关前置检查的聚合入口：应用状态 + 凭证有效性 + scope + 配额扣减 + 调用流水。
// 两种凭证模式：access_token（用户授权）或 app_key + signature（应用级签名，
// signature = HMAC-SHA256(secret, canonical)，canonical 含 method/path/timestamp/nonce/body 摘要）。
// 幂等：request_id 唯一，重试返回首次判定结果且不重复扣配额。
message AuthorizeRequestReq {
  string access_token = 1;
  string app_key = 2;
  string signature = 3;        // 签名模式必填
  int64 timestamp = 4;         // 请求时间戳（Unix 秒），超出 SkewSeconds 拒绝
  string nonce = 5;            // 防重放随机串
  string method = 6;
  string path = 7;
  string body_digest = 8;      // 请求体 sha256 摘要，不含原文
  string api_code = 9;         // 接口标识（配额与 scope 的键）
  string required_scope = 10;
  string request_id = 11;      // 幂等键，必填
  string client_ip = 12;       // 记录用（脱敏后落库，不外发）
  string trace_id = 13;
}

message AuthorizeRequestReply {
  bool allowed = 1;
  string deny_reason = 2;      // 拒绝原因码
  int64 app_id = 3;
  int64 mid = 4;
  repeated string scope = 5;
  int64 quota_limit = 6;
  int64 quota_remaining = 7;
  int64 window_reset_at = 8;
  int64 retry_after_seconds = 9; // 限流拒绝时的建议等待
  int64 call_log_id = 10;
}

// --- 配额 ---

// QuotaPolicyInfo 配额规则（应用 × 接口 × 时间窗）。app_id=0 表示全局默认，
// api_code="*" 表示该应用全部接口。
message QuotaPolicyInfo {
  int64 policy_id = 1;
  int64 app_id = 2;
  string api_code = 3;
  int64 window_seconds = 4;
  int64 limit = 5;
  bool enabled = 6;
  int64 operator = 7;
  int64 ctime = 8;
  int64 mtime = 9;
}

message UpsertQuotaPolicyReq {
  int64 policy_id = 1;         // 0 表示新建（按唯一键 upsert）
  int64 app_id = 2;            // 0 表示全局默认
  string api_code = 3;         // "*" 表示全部接口
  int64 window_seconds = 4;
  int64 limit = 5;
  bool enabled = 6;
  int64 operator_mid = 7;      // 运营，必填 > 0
  string trace_id = 8;
}

message UpsertQuotaPolicyReply {
  int64 policy_id = 1;
  bool created = 2;
}

message ListQuotaPoliciesReq {
  int64 app_id = 1;
  string api_code = 2;
  string cursor = 3;
  int32 ps = 4;
  int64 operator_mid = 5;
  string trace_id = 6;
}

message ListQuotaPoliciesReply {
  repeated QuotaPolicyInfo list = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// QuotaUsageInfo 配额用量投影（时间窗对齐到窗口起点，可重算）。
message QuotaUsageInfo {
  int64 app_id = 1;
  string api_code = 2;
  int64 window_seconds = 3;
  int64 window_start = 4;
  int64 used = 5;
  int64 limit = 6;
  int64 remaining = 7;
  int64 updated_at = 8;
}

message ListQuotaUsageReq {
  int64 app_id = 1;
  string api_code = 2;
  int64 window_start = 3;      // 0 表示当前窗口
  int64 operator_mid = 4;
  string trace_id = 5;
}

message ListQuotaUsageReply {
  repeated QuotaUsageInfo list = 1;
}

// RecomputeQuotaReq 从 op_api_call_log 重算配额投影（cron 或运营触发）。
// 说明：配额计数是投影，不作为唯一事实源；重算结果差异只影响限额判定，不影响业务数据。
message RecomputeQuotaReq {
  int64 app_id = 1;            // 0 表示全部应用
  string api_code = 2;         // "*" 表示全部接口
  int64 window_start = 3;      // 重算区间起（含）
  int64 window_end = 4;        // 重算区间止（不含）
  bool dry_run = 5;            // true 只返回差异不写回
  int64 operator_mid = 6;
  string trace_id = 7;
}

message RecomputeQuotaReply {
  int64 windows_scanned = 1;
  int64 windows_fixed = 2;
  int64 max_delta = 3;         // 单窗口最大修正量（观测漂移）
}

// --- Webhook ---

// WebhookEndpointInfo 回调端点。sign_key_version 用于告知应用当前签名密钥版本；
// 签名材料本身不入库（由服务端 master pepper 与 app_id + key_version 派生，
// 因此数据库泄露也无法伪造合法签名，见 README）。
message WebhookEndpointInfo {
  int64 endpoint_id = 1;
  int64 app_id = 2;
  WebhookEventType event_type = 3;
  string url = 4;
  int32 sign_key_version = 5;
  bool enabled = 6;
  string description = 7;
  int64 verified_at = 8;       // 验证通过时间（未验证为 0，未验证不投递）
  int64 ctime = 9;
  int64 mtime = 10;
}

message RegisterWebhookReq {
  int64 app_id = 1;
  WebhookEventType event_type = 2;
  string url = 3;              // https only，禁止指向内网地址（SSRF 防护）
  string description = 4;
  int64 operator_mid = 5;      // owner 或运营
  bool is_operator = 6;
  string trace_id = 7;
}

message RegisterWebhookReply {
  int64 endpoint_id = 1;
  bool created = 2;
  int32 sign_key_version = 3;
  string verification_challenge = 4; // 需应用回显以完成验证
}

message ListWebhooksReq {
  int64 app_id = 1;
  bool include_disabled = 2;
  int64 operator_mid = 3;
  string trace_id = 4;
}

message ListWebhooksReply {
  repeated WebhookEndpointInfo list = 1;
}

message DeleteWebhookReq {
  int64 app_id = 1;
  int64 endpoint_id = 2;
  int64 operator_mid = 3;
  bool is_operator = 4;
  string reason = 5;
  string trace_id = 6;
}

message DeleteWebhookReply {
  bool deleted = 1;
  int32 deliveries_suppressed = 2; // 被抑制的待投递数
}

// EnqueueWebhookEventReq 领域方向应用投递事件（幂等：event_id 唯一，
// 同一 event_id 重复入队不产生第二条投递任务）。
message EnqueueWebhookEventReq {
  int64 app_id = 1;
  WebhookEventType event_type = 2;
  string event_id = 3;         // 幂等键（必填，来自领域 event envelope）
  string payload = 4;          // JSON 文本，禁止含 token/secret/身份证/手机号明文
  int64 occurred_at = 5;       // 事件发生时间（Unix 秒）
  int64 mid = 6;               // 关联用户（可为 0）
  string biz_type = 7;
  string biz_id = 8;
  string trace_id = 9;
}

message EnqueueWebhookEventReply {
  repeated int64 delivery_ids = 1; // 命中的端点数对应的投递任务
  int32 matched_endpoints = 2;
  bool deduplicated = 3;           // true 表示 event_id 已入过队
}

// WebhookDeliveryInfo 投递记录（重试退避与死信）。
message WebhookDeliveryInfo {
  int64 delivery_id = 1;
  int64 app_id = 2;
  int64 endpoint_id = 3;
  WebhookEventType event_type = 4;
  string event_id = 5;
  string payload_digest = 6;       // sha256:<hex>，不存正文
  WebhookDeliveryState state = 7;
  int32 attempt = 8;
  int32 max_attempts = 9;
  int64 next_retry_at = 10;
  int64 last_status_code = 11;
  string last_error = 12;          // 截断且脱敏
  int64 ctime = 13;
  int64 mtime = 14;
}

message ListWebhookDeliveriesReq {
  int64 app_id = 1;
  int64 endpoint_id = 2;
  WebhookDeliveryState state = 3;  // UNSPECIFIED 表示不过滤
  string cursor = 4;
  int32 ps = 5;
  int64 operator_mid = 6;
  string trace_id = 7;
}

message ListWebhookDeliveriesReply {
  repeated WebhookDeliveryInfo list = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// RetryWebhookDeliveryReq 死信重放（运营触发，幂等：同一 delivery 重放会重置 attempt 计数）。
message RetryWebhookDeliveryReq {
  int64 delivery_id = 1;
  int64 operator_mid = 2;          // 必填 > 0
  bool ignore_dead = 3;            // true 允许重放 DEAD 记录
  string reason = 4;
  string trace_id = 5;
}

message RetryWebhookDeliveryReply {
  int64 delivery_id = 1;
  WebhookDeliveryState state = 2;
  int64 next_retry_at = 3;
  bool replayed = 4;
}

// OpenPlatform 开放平台服务。
// 方法名表达领域动作，不暴露数据库 CRUD（docs/api-and-events.md §1.1）。
// 不提供任何会员、订单、支付、投币、分成或广告相关的接口位（AGENTS.md §1）。
service OpenPlatform {
  // 注册应用（client_token 幂等），secret 仅此一次返回。
  rpc RegisterApplication(RegisterApplicationReq) returns (RegisterApplicationReply);
  // 查询应用（不回显密钥）。
  rpc GetApplication(GetApplicationReq) returns (GetApplicationReply);
  // 开发者/运营侧应用分页列表。
  rpc ListApplications(ListApplicationsReq) returns (ListApplicationsReply);
  // 修改资料或推进状态机（乐观锁版本）。
  rpc UpdateApplication(UpdateApplicationReq) returns (UpdateApplicationReply);
  // 轮换密钥（旧密钥宽限期后可用性明确）。
  rpc RotateApplicationSecret(RotateApplicationSecretReq) returns (RotateApplicationSecretReply);
  // 吊销密钥（疑似泄露的应急处置）。
  rpc RevokeApplicationSecret(RevokeApplicationSecretReq) returns (RevokeApplicationSecretReply);
  // scope 目录（含读写与风险级别声明）。
  rpc ListScopes(ListScopesReq) returns (ListScopesReply);
  // 运营审批 scope 授予/回收。
  rpc GrantApplicationScopes(GrantApplicationScopesReq) returns (GrantApplicationScopesReply);
  // 用户同意后签发短期授权码。
  rpc IssueAuthorizationCode(IssueAuthorizationCodeReq) returns (IssueAuthorizationCodeReply);
  // 授权码换 token（一次性消费 + 重放检测）。
  rpc ExchangeAuthorizationCode(ExchangeAuthorizationCodeReq) returns (ExchangeAuthorizationCodeReply);
  // refresh token 轮换（旧值重放即撤销整条 grant）。
  rpc RefreshAccessToken(RefreshAccessTokenReq) returns (RefreshAccessTokenReply);
  // 撤销授权（写撤销位点，立即生效）。
  rpc RevokeAuthorization(RevokeAuthorizationReq) returns (RevokeAuthorizationReply);
  // token 校验（含 grant 撤销位点比对）。
  rpc IntrospectToken(IntrospectTokenReq) returns (IntrospectTokenReply);
  // 网关前置聚合检查：凭证 + scope + 配额扣减 + 调用流水（request_id 幂等）。
  rpc AuthorizeRequest(AuthorizeRequestReq) returns (AuthorizeRequestReply);
  // 新增/更新配额规则（运营）。
  rpc UpsertQuotaPolicy(UpsertQuotaPolicyReq) returns (UpsertQuotaPolicyReply);
  // 配额规则分页。
  rpc ListQuotaPolicies(ListQuotaPoliciesReq) returns (ListQuotaPoliciesReply);
  // 配额用量查询（投影）。
  rpc ListQuotaUsage(ListQuotaUsageReq) returns (ListQuotaUsageReply);
  // 从调用流水重算配额投影。
  rpc RecomputeQuota(RecomputeQuotaReq) returns (RecomputeQuotaReply);
  // 注册回调端点（需验证后才投递）。
  rpc RegisterWebhook(RegisterWebhookReq) returns (RegisterWebhookReply);
  // 回调端点列表。
  rpc ListWebhooks(ListWebhooksReq) returns (ListWebhooksReply);
  // 删除回调端点（抑制未投递任务）。
  rpc DeleteWebhook(DeleteWebhookReq) returns (DeleteWebhookReply);
  // 领域事件入队（event_id 幂等）。
  rpc EnqueueWebhookEvent(EnqueueWebhookEventReq) returns (EnqueueWebhookEventReply);
  // 投递记录分页（观测与排障）。
  rpc ListWebhookDeliveries(ListWebhookDeliveriesReq) returns (ListWebhookDeliveriesReply);
  // 死信重放（运营）。
  rpc RetryWebhookDelivery(RetryWebhookDeliveryReq) returns (RetryWebhookDeliveryReply);
}
