syntax = "proto3";

package video.v1;

option go_package = "go-video/services/video/rpc";

// 说明：video 服务持有 UGC/PUGC 稿件、版本与发布状态。
// 依据 AGENTS.md §1，不实现商业化（会员、订单、支付、投币、广告）；
// 依据 §5，本服务只写自己的 video_submission/video_version/video_audit_log，
// 不直接改 catalog、recommend、engagement 等其他服务的可变数据。
// 依据 §8，TransitionState 只能推进合法状态，不能直接写入 PUBLISHED。

// 稿件状态枚举
enum SubmissionState {
  STATE_UNSPECIFIED = 0;     // 未指定
  STATE_DRAFT = 1;           // 草稿
  STATE_UPLOADING = 2;       // 上传中
  STATE_UPLOADED = 3;        // 上传完成
  STATE_SCANNING = 4;        // 扫描中
  STATE_TRANSCODING = 5;     // 转码中
  STATE_READY_FOR_REVIEW = 6; // 待审核
  STATE_REJECTED = 7;        // 审核驳回
  STATE_APPEAL = 8;          // 申诉中
  STATE_APPROVED = 9;        // 审核通过
  STATE_SCHEDULED = 10;      // 定时发布
  STATE_PUBLISHED = 11;      // 已发布
  STATE_OFFLINE = 12;        // 下架
  STATE_EXPIRED = 13;        // 过期
  STATE_DELETED = 14;        // 删除
}

// 空响应
message EmptyReply {}

// 稿件信息
message Submission {
  int64 aid = 1;            // 稿件 ID
  int64 mid = 2;            // 投稿用户 ID
  string title = 3;         // 标题
  string desc = 4;          // 简介
  string cover = 5;         // 封面 URL
  int32 typeid = 6;         // 分区 ID
  string tag = 7;           // 标签（逗号分隔）
  SubmissionState state = 8; // 当前状态
  int64 ctime = 9;          // 创建时间（Unix 秒）
  int64 mtime = 10;         // 修改时间（Unix 秒）
}

// 稿件版本信息
message VideoVersion {
  int64 aid = 1;            // 稿件 ID
  int64 version = 2;        // 版本号
  string asset_id = 3;      // 关联媒资 ID
  SubmissionState state = 4; // 版本状态
  int64 ctime = 5;          // 创建时间（Unix 秒）
}

// --- 创建稿件 ---

message CreateSubmissionReq {
  int64 mid = 1;            // 投稿用户 ID
  string title = 2;         // 标题
  string desc = 3;          // 简介
  string cover = 4;         // 封面 URL
  int32 typeid = 5;         // 分区 ID
  string tag = 6;           // 标签
  string ip = 7;            // 调用方 IP
}

message SubmissionReply {
  Submission submission = 1; // 稿件详情
}

// --- 查询稿件详情 ---

message SubmissionReq {
  int64 aid = 1;            // 稿件 ID
  int64 mid = 2;            // 调用方用户 ID（鉴权与所有者校验）
  string ip = 3;            // 调用方 IP
}

// --- 分页查询稿件 ---

message ListReq {
  int64 mid = 1;            // 按投稿人过滤（0 不限）
  int32 typeid = 2;         // 按分区过滤（0 不限）
  int32 pn = 3;             // 页码（从 1 开始）
  int32 ps = 4;             // 每页大小（最大 50）
  string ip = 5;            // 调用方 IP
}

message SubmissionsReply {
  int32 total = 1;                 // 总数
  repeated Submission submissions = 2; // 稿件列表
}

// --- 更新稿件元信息 ---

message UpdateSubmissionReq {
  int64 aid = 1;            // 稿件 ID
  int64 mid = 2;            // 调用方用户 ID（必须是所有者）
  string title = 3;         // 标题（空表示不更新）
  string desc = 4;          // 简介（空表示不更新）
  string cover = 5;         // 封面 URL（空表示不更新）
  int32 typeid = 6;         // 分区 ID（0 表示不更新）
  string tag = 7;           // 标签（空表示不更新）
  string ip = 8;            // 调用方 IP
}

// --- 推进状态机 ---

message TransitionReq {
  int64 aid = 1;            // 稿件 ID
  SubmissionState target = 2; // 目标状态
  string operator = 3;      // 操作人（运营/系统/回调来源）
  string reason = 4;        // 变更原因
  string ip = 5;            // 调用方 IP
}

// --- 按状态查询稿件 ---

message ListByStateReq {
  SubmissionState state = 1; // 状态过滤
  int32 pn = 2;             // 页码（从 1 开始）
  int32 ps = 3;             // 每页大小（最大 50）
  string ip = 4;            // 调用方 IP
}

// --- 查询可播放来源 ---

// PlayableSourceReq 供 gateway/app 在签发播放地址前解析 aid → asset_id。
// 依据 AGENTS.md §5，稿件与媒资版次的映射（video_version）归本服务所有，
// playback/asset/transcode 不得自行猜测；playback 只接收网关解析出的 object_key。
message PlayableSourceReq {
  int64 aid = 1;  // 稿件 ID
  int64 mid = 2;  // 请求者用户 ID（0 游客；仅日志与排障，不做起点鉴权）
  string ip = 3;  // 调用方 IP
}

// PlayableSourceReply 返回当前可对外播放的版次。
// 只有稿件处于 PUBLISHED 且最新版次带非空 asset_id 才返回来源；
// 定时发布（SCHEDULED）在状态机推进为 PUBLISHED 之前不可播放，
// 对它返回 video: submission not playable，避免网关绕过 §8 提前放流。
message PlayableSourceReply {
  int64 aid = 1;                        // 稿件 ID
  VideoVersion version = 2;             // 当前可播放版次（version.asset_id 为媒资 ID）
  SubmissionState submission_state = 3; // 稿件状态（便于网关区分排障原因）
}

// Video 稿件主服务。
// 依据 AGENTS.md §5，本服务只写 video_submission、video_version、video_audit_log；
// 依据 §8，状态推进严格走合法状态机，禁止直接写 PUBLISHED。
service Video {
  // 创建稿件（DRAFT 状态），返回新稿件
  rpc CreateSubmission(CreateSubmissionReq) returns (SubmissionReply);
  // 查询稿件详情
  rpc GetSubmission(SubmissionReq) returns (SubmissionReply);
  // 分页查询稿件（按 mid 或 typeid 过滤）
  rpc ListSubmissions(ListReq) returns (SubmissionsReply);
  // 更新稿件元信息（仅 DRAFT 可改）
  rpc UpdateSubmission(UpdateSubmissionReq) returns (SubmissionReply);
  // 删除稿件（状态流转到 DELETED，保留审计）
  rpc DeleteSubmission(SubmissionReq) returns (EmptyReply);
  // 推进稿件状态机（校验合法转换，非法转换返回 ErrInvalidStateTransition）
  rpc TransitionState(TransitionReq) returns (SubmissionReply);
  // 按状态查询稿件（运营/系统用）
  rpc ListByState(ListByStateReq) returns (SubmissionsReply);
  // 查询稿件当前可播放版次（aid → asset_id，供网关解析播放来源）
  rpc GetPlayableSource(PlayableSourceReq) returns (PlayableSourceReply);
}
