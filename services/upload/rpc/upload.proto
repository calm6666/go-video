syntax = "proto3";

package upload.v1;

option go_package = "go-video/services/upload/rpc";

// upload 服务负责大文件分片上传会话生命周期与 OSS 分片预签名 URL 签发。
// 依据 AGENTS.md §6：客户端直传 OSS，服务端只签发短期预签名 URL，
// 不向客户端下发 OSS 长期密钥；完成上传只推进到 COMPLETED 并发布
// media.task.v1 事件，由 asset/transcode 接管后续状态机。
// 依据 §1：不实现商业化。

// 空响应
message EmptyReply {}

// 上传会话状态
enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;  // 未指定
  UPLOAD_STATE_INITIALIZED = 1;  // 已初始化，等待分片上传
  UPLOAD_STATE_UPLOADING = 2;    // 上传中
  UPLOAD_STATE_COMPLETED = 3;    // 已完成（OSS 分片合并成功）
  UPLOAD_STATE_ABORTED = 4;      // 已取消
  UPLOAD_STATE_FAILED = 5;       // 失败
}

// 分片状态
enum ChunkState {
  CHUNK_STATE_UNSPECIFIED = 0; // 未指定
  CHUNK_STATE_PENDING = 1;     // 待上传
  CHUNK_STATE_UPLOADED = 2;    // 已上传到 OSS
  CHUNK_STATE_VERIFIED = 3;    // 已校验（ETag 匹配）
}

// 分片信息
message Chunk {
  int32 chunk_no = 1; // 分片序号（从 1 开始）
  int64 size = 2;      // 分片大小（字节）
  string etag = 3;     // 分片 ETag（OSS 返回）
  ChunkState state = 4; // 分片状态
  int64 ctime = 5;     // 创建时间（Unix 秒）
}

// --- InitUpload ---

// 初始化上传会话请求
message InitUploadReq {
  int64 mid = 1;          // 用户 ID
  string filename = 2;    // 文件名
  int64 size = 3;         // 文件总大小（字节）
  int32 typeid = 4;       // 稿件类型 ID
  string md5 = 5;         // 文件 MD5（用于秒传判断，可选）
  int64 chunk_size = 6;   // 分片大小（字节，0 由服务端决定）
  int32 total_chunks = 7; // 分片总数
  string ip = 8;          // 调用方 IP
}

// 初始化上传会话响应
message InitUploadReply {
  string upload_id = 1;      // 上传会话 ID
  string bucket = 2;         // OSS bucket
  string object_key = 3;     // OSS 对象 key 占位
  string upload_protocol = 4; // 上传协议（如 "multipart"）
  int64 chunk_size = 5;      // 服务端确定的分片大小
  int32 total_chunks = 6;    // 分片总数
  bool instant = 7;          // 是否秒传命中（true 时无需上传）
}

// --- GetUploadUrl ---

// 获取分片预签名 URL 请求
message GetUrlReq {
  string upload_id = 1; // 上传会话 ID
  int32 chunk_no = 2;   // 分片序号（从 1 开始）
  int64 chunk_size = 3; // 分片大小（字节）
  string ip = 4;        // 调用方 IP
}

// 获取分片预签名 URL 响应
message GetUrlReply {
  string upload_id = 1;             // 上传会话 ID
  int32 chunk_no = 2;               // 分片序号
  string url = 3;                   // 预签名 PUT URL（短期有效）
  string method = 4;                // HTTP 方法（PUT）
  int64 expiration = 5;             // URL 过期时间（Unix 秒）
  map<string, string> headers = 6;  // 上传需附带的 header
}

// --- CompleteUpload ---

// 分片清单条目
message ChunkPart {
  int32 chunk_no = 1; // 分片序号
  string etag = 2;    // OSS 返回的 ETag
}

// 完成上传请求
message CompleteUploadReq {
  string upload_id = 1;           // 上传会话 ID
  repeated ChunkPart parts = 2;   // 分片清单
  string md5 = 3;                 // 完整文件 MD5
  string ip = 4;                  // 调用方 IP
}

// 完成上传响应
message CompleteUploadReply {
  string upload_id = 1; // 上传会话 ID
  string asset_id = 2;  // asset_id 占位（asset 服务接管后回填真实 ID）
  string object_key = 3; // OSS 对象 key
  int64 size = 4;        // 文件大小
  string md5 = 5;        // 文件 MD5
  UploadState state = 6; // 会话状态
}

// --- AbortUpload ---

// 取消上传请求
message AbortUploadReq {
  string upload_id = 1; // 上传会话 ID
  string ip = 2;        // 调用方 IP
}

// --- GetUploadStatus ---

// 查询上传状态请求
message UploadStatusReq {
  string upload_id = 1; // 上传会话 ID
  string ip = 2;        // 调用方 IP
}

// 查询上传状态响应
message UploadStatusReply {
  string upload_id = 1;           // 上传会话 ID
  UploadState state = 2;          // 会话状态
  int64 size = 3;                 // 总大小
  int64 uploaded_size = 4;        // 已上传大小
  int32 total_chunks = 5;         // 分片总数
  int32 completed_chunks = 6;     // 已完成分片数
  repeated Chunk chunks = 7;      // 分片列表
  string asset_id = 8;            // 关联 asset_id（若已完成）
}

// Upload 分片上传会话服务。
service Upload {
  // 初始化上传会话，返回 upload_id 和 OSS bucket/object_key 占位
  rpc InitUpload(InitUploadReq) returns (InitUploadReply);
  // 为某分片获取 OSS 预签名 PUT URL（短期，默认 15 分钟有效）
  rpc GetUploadUrl(GetUrlReq) returns (GetUrlReply);
  // 客户端上传完全部分片后调用，服务端校验分片清单并触发 OSS 完成分片上传；
  // 返回 asset_id 占位（后续 asset 服务接管），并发布 media.task.v1 事件
  rpc CompleteUpload(CompleteUploadReq) returns (CompleteUploadReply);
  // 取消上传（删除 OSS 分片）
  rpc AbortUpload(AbortUploadReq) returns (EmptyReply);
  // 查询上传状态和已完成分片列表
  rpc GetUploadStatus(UploadStatusReq) returns (UploadStatusReply);
}
