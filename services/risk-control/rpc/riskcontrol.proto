syntax = "proto3";

package riskcontrol.v1;

option go_package = "go-video/services/risk-control/rpc";

// 说明：risk-control 是账号与行为风控领域服务（AGENTS.md §5 数据所有者）。
// 边界划分：
//   - 内容安全（稿件/评论/弹幕是否违规）归 moderation-orchestrator + moderation-worker；
//   - 本服务只裁决“谁、在什么设备/网络上、以什么频率做某个受保护动作”，
//     即账号风险、行为频率、设备画像与处罚状态；
//   - 本服务不判定内容违规，也不推进稿件状态机（AGENTS.md §8）。
// 契约约束：
//   - 裁决必须可解释：返回 decision + score + 命中的 rule_id/version 明细 + 决策依据 basis；
//   - 不接收也不返回明文 IP、手机号、身份证：IP 只以调用方预哈希的 ip_hash 传入，
//     设备号只以 device_id 传入并仅落库存 hash；
//   - 写接口全部要求幂等键（request_id / event_id / idempotency_key）；
//   - 不提供任何广告投放、广告位分析能力（AGENTS.md §1、§7 红线）。

// 空响应
message EmptyReply {}

// GuardedAction 受风控保护的账号/行为动作。
// 数值稳定，新增动作只能追加，不得复用已删除编号。
enum GuardedAction {
  ACTION_UNSPECIFIED = 0; // 未指定（视为非法入参）
  ACTION_SUBMIT_VIDEO = 1; // 投稿
  ACTION_COMMENT = 2;      // 评论
  ACTION_DANMAKU = 3;      // 弹幕
  ACTION_FOLLOW = 4;       // 关注
  ACTION_LOGIN = 5;        // 登录
  ACTION_RENAME = 6;       // 改名
  ACTION_LIVE_START = 7;   // 直播开播
}

// Decision 风控裁决结果。
enum Decision {
  DECISION_UNSPECIFIED = 0; // 未指定
  DECISION_ALLOW = 1;       // 放行
  DECISION_CHALLENGE = 2;   // 要求人机校验/二次校验后放行
  DECISION_BLOCK = 3;       // 拒绝本次动作
  DECISION_REVIEW = 4;      // 放行但结果进入人工/异步复核（不用于阻断类动作）
}

// PunishmentState 处罚状态机：ACTIVE → LIFTED（运营解除）／EXPIRED（到期）。
enum PunishmentState {
  PUNISHMENT_STATE_UNSPECIFIED = 0;
  PUNISHMENT_STATE_ACTIVE = 1;  // 生效中
  PUNISHMENT_STATE_LIFTED = 2;  // 已解除（终态）
  PUNISHMENT_STATE_EXPIRED = 3; // 已过期（终态）
}

// ListType 名单类型。
enum ListType {
  LIST_TYPE_UNSPECIFIED = 0;
  LIST_TYPE_BLACK = 1; // 黑名单：命中直接 BLOCK
  LIST_TYPE_WHITE = 2; // 白名单：命中跳过规则评估（不覆盖生效处罚）
}

// TargetType 名单目标类型。
enum TargetType {
  TARGET_TYPE_UNSPECIFIED = 0;
  TARGET_TYPE_MID = 1;     // 账号 ID
  TARGET_TYPE_DEVICE = 2;  // 设备 hash（不落明文设备号）
  TARGET_TYPE_IP_HASH = 3; // 调用方预哈希的 IP 摘要
}

// Metric 规则评估使用的指标来源。
// 未实现的指标在评估时按“不可观测”跳过，不会被误判为命中。
enum Metric {
  METRIC_UNSPECIFIED = 0;
  METRIC_ACTION_COUNT = 1;          // mid+action 滑窗内动作次数（Redis 计数器）
  METRIC_DEVICE_ACTION_COUNT = 2;   // device+action 滑窗内动作次数
  METRIC_IP_ACTION_COUNT = 3;       // ip_hash+action 滑窗内动作次数
  METRIC_DEVICE_RISK_SCORE = 4;     // 设备画像风险分（0-100）
  METRIC_DEVICE_MID_COUNT = 5;      // 设备关联账号数
}

// CompareOp 阈值比较方向。
enum CompareOp {
  OP_UNSPECIFIED = 0;
  OP_GT = 1;  // 观测值 > 阈值
  OP_GTE = 2; // 观测值 >= 阈值
  OP_LT = 3;  // 观测值 < 阈值
  OP_LTE = 4; // 观测值 <= 阈值
  OP_EQ = 5;  // 观测值 == 阈值
}

// --- 公共结构 ---

// Rule 风控规则（决策依据可解释性的来源，version 递增以便解释历史裁决）。
message Rule {
  int64 rule_id = 1;              // 规则 ID
  string name = 2;                // 规则名（全局唯一）
  GuardedAction action_type = 3;  // 适用动作，ACTION_UNSPECIFIED 表示全部动作
  Metric metric = 4;              // 指标
  CompareOp op = 5;               // 比较方向
  int64 threshold = 6;            // 阈值
  int64 window_seconds = 7;       // 统计时间窗（秒）
  Decision decision = 8;          // 命中后的裁决
  int32 priority = 9;             // 优先级（越大越先出现在 hit_rule_ids）
  int32 state = 10;               // 0 禁用、1 启用
  int32 version = 11;             // 规则版本，任一评估字段变更即 +1
  int64 operator = 12;            // 最近一次变更的运营 ID（审计必填）
  int64 ctime = 13;               // 创建时间（Unix 秒）
  int64 mtime = 14;               // 修改时间（Unix 秒）
}

// RuleHit 单条规则命中明细（决策解释）。
message RuleHit {
  int64 rule_id = 1;
  int32 version = 2;              // 命中时的规则版本
  string name = 3;
  Metric metric = 4;
  CompareOp op = 5;
  int64 threshold = 6;
  int64 observed = 7;             // 命中时刻的观测值
  int64 window_seconds = 8;
  Decision decision = 9;
  int32 priority = 10;
}

// PunishmentSnapshot 生效中的处罚摘要（返回给调用方用于提示剩余时长）。
message PunishmentSnapshot {
  int64 punishment_id = 1;
  GuardedAction scope = 2;        // 生效范围，ACTION_UNSPECIFIED 表示全域
  Decision decision = 3;
  bool permanent = 4;             // true 表示无期限
  int64 end_at = 5;               // 到期时间（Unix 秒），0 表示永久
  int64 remaining_seconds = 6;    // 剩余秒数，永久时为 0
  string reason_code = 7;         // 面向端的稳定原因码（不含运营内部说明）
}

// Punishment 处罚记录（运营视角完整字段，仅 admin 链路使用）。
message Punishment {
  int64 punishment_id = 1;
  int64 mid = 2;
  GuardedAction scope = 3;
  Decision decision = 4;
  string reason = 5;              // 运营内部说明，禁止下发终端
  string reason_code = 6;         // 面向端的稳定原因码
  int64 operator = 7;             // 下发处罚的运营 ID
  int64 start_at = 8;
  int64 end_at = 9;               // 0 表示永久
  PunishmentState state = 10;
  string idempotency_key = 11;
  int64 lift_operator = 12;       // 解除人（0 表示未解除/系统过期）
  int64 ctime = 13;
  int64 mtime = 14;
}

// DeviceProfile 设备画像（只暴露 device_hash，不回传设备号原文）。
message DeviceProfile {
  string device_hash = 1;         // sha256(device_id) 十六进制，受控 ID
  repeated string labels = 2;     // 风险标签
  int32 risk_score = 3;           // 0-100
  int64 first_seen = 4;
  int64 last_seen = 5;
  int64 related_mid_count = 6;    // 关联账号数（来自 risk_device_mid）
  int64 ctime = 7;
  int64 mtime = 8;
}

// --- CheckAction：同步裁决 ---

message CheckActionReq {
  int64 mid = 1;                  // 用户 ID（登录类动作可为 0）
  GuardedAction action = 2;       // 受保护动作
  string device_id = 3;           // 设备标识原文，服务端只落库存 hash
  string ip_hash = 4;             // 调用方预哈希的 IP 摘要（禁止传明文 IP）
  string platform = 5;            // android/ios/harmony/desktop
  string app_version = 6;
  map<string, string> request_context = 7; // 业务上下文摘要（键值白名单，不入库敏感值）
  string request_id = 8;          // 幂等键；为空时服务端生成
  string trace_id = 9;
}

message CheckActionReply {
  string request_id = 1;          // 回填实际使用的幂等键
  Decision decision = 2;
  int32 score = 3;                // 0-100，规则命中的严重度合成，见 README
  repeated int64 hit_rule_ids = 4;      // 按 (priority DESC, rule_id ASC) 排序
  repeated RuleHit rule_hits = 5;        // 与 hit_rule_ids 同序的命中明细
  PunishmentSnapshot punishment = 6;     // 生效处罚摘要（无处罚时不返回）
  string action_code = 7;         // 建议动作文案 code（客户端自行渲染，服务端不写死 UI）
  int64 challenge_ttl_seconds = 8; // CHALLENGE 建议有效期，其它裁决为 0
  string basis = 9;               // 决策依据：blacklist/whitelist/punishment/rules/no_rule/fallback_db_unavailable/fallback_invalid
  repeated int64 skipped_rule_ids = 10; // 因依赖不可观测被跳过的规则
  bool evaluated = 11;            // 是否执行了规则评估（名单/处罚短路时为 false）
  bool degraded = 12;             // 是否处于依赖故障降级路径
}

// --- ReportAction：行为上报（写滑窗计数，非 SPM 广告分析） ---

message ReportActionReq {
  int64 mid = 1;
  GuardedAction action = 2;
  string device_id = 3;
  string ip_hash = 4;
  string platform = 5;
  int64 count = 6;                // 增量，<=0 视为 1
  int64 occurred_at = 7;          // 事件发生时间（Unix 秒），0 表示服务端当前时间
  string event_id = 8;            // 幂等键：同 event_id 只计一次
  string trace_id = 9;
}

message ReportActionReply {
  bool deduplicated = 1;          // true 表示 event_id 命中去重，未累加
  int64 window_seconds = 2;       // 本次使用的统计窗口
  int64 mid_count = 3;            // 上报后 mid+action 窗口计数
  int64 device_count = 4;         // 上报后 device+action 窗口计数（无设备号时为 0）
  int64 ip_count = 5;             // 上报后 ip_hash+action 窗口计数（无 ip_hash 时为 0）
}

// --- 设备画像 ---

message GetDeviceProfileReq {
  string device_id = 1;           // 设备标识原文（仅用于计算 hash，不落库）
  string device_hash = 2;         // 也可直接传已受控 ID，优先 device_id
}

message GetDeviceProfileReply {
  DeviceProfile profile = 1;
  bool found = 2;
}

message UpsertDeviceProfileReq {
  string device_id = 1;
  string device_hash = 2;
  repeated string labels = 3;     // 追加合并，去重后按字典序存储
  int32 risk_score = 4;           // >=0 时覆盖，<0 表示不修改
  int64 mid = 5;                  // >0 时记录设备-账号关联（幂等）
  string source = 6;              // 写入来源：login/gateway/operation/system，审计用
  int64 operator = 7;             // 人工改标签时必填（>0），系统写入可为 0
  string idempotency_key = 8;     // 可选：人工写入的幂等键
}

message UpsertDeviceProfileReply {
  DeviceProfile profile = 1;
  bool created = 2;               // false 表示更新既有画像
  bool relation_added = 3;        // 本次是否新增设备-账号关联
}

// --- 处罚 ---

message ApplyPunishmentReq {
  int64 mid = 1;
  GuardedAction scope = 2;        // ACTION_UNSPECIFIED 表示全域处罚
  Decision decision = 3;          // 生效裁决：BLOCK/CHALLENGE/REVIEW
  string reason = 4;              // 运营内部说明
  string reason_code = 5;         // 面向端的稳定原因码
  int64 operator = 6;             // 必填 >0，审计
  int64 duration_seconds = 7;     // >0 限期处罚；0 表示永久
  string idempotency_key = 8;     // 必填：同 key 重复下发返回既有处罚
  string trace_id = 9;
}

message ApplyPunishmentReply {
  Punishment punishment = 1;
  bool created = 2;               // false 表示幂等命中既有处罚
}

message LiftPunishmentReq {
  int64 punishment_id = 1;        // 优先使用；为 0 时按 (mid, scope) 取最新生效处罚
  int64 mid = 2;
  GuardedAction scope = 3;
  int64 operator = 4;             // 必填 >0
  string reason = 5;
  string idempotency_key = 6;     // 可选：重复解除的幂等键（仅用于日志关联）
}

message LiftPunishmentReply {
  Punishment punishment = 1;
  bool changed = 2;               // false 表示处罚已是终态（幂等返回当前状态）
}

message ListPunishmentsReq {
  int64 mid = 1;                  // 0 表示不过滤
  GuardedAction scope = 2;        // ACTION_UNSPECIFIED 表示不过滤
  PunishmentState state = 3;      // UNSPECIFIED 表示不过滤
  bool only_active = 4;           // true 时仅返回当前时间生效中的处罚
  int32 pn = 5;
  int32 ps = 6;                   // 最大 50
}

message ListPunishmentsReply {
  repeated Punishment punishments = 1;
  int32 total = 2;
  int32 pn = 3;
  int32 ps = 4;
}

// --- 规则管理 ---

message UpsertRuleReq {
  int64 rule_id = 1;              // 0 表示新建
  string name = 2;                // 全局唯一，新建必填
  GuardedAction action_type = 3;
  Metric metric = 4;              // 必须是已实现指标
  CompareOp op = 5;
  int64 threshold = 6;
  int64 window_seconds = 7;       // >0
  Decision decision = 8;          // 不能是 ALLOW（放行不是处罚性裁决）
  int32 priority = 9;
  int32 state = 10;               // 0 禁用、1 启用
  int64 operator = 11;            // 必填 >0：规则变更必须由 admin operator 审计
  string idempotency_key = 12;    // 可选：避免运营重试产生新版本
}

message UpsertRuleReply {
  Rule rule = 1;
  bool created = 2;
}

message ListRulesReq {
  GuardedAction action_type = 1;  // ACTION_UNSPECIFIED 表示不过滤
  Metric metric = 2;              // METRIC_UNSPECIFIED 表示不过滤
  int32 state = 3;                // -1 不过滤，0/1 精确过滤
  int32 pn = 4;
  int32 ps = 5;                   // 最大 50
}

message ListRulesReply {
  repeated Rule rules = 1;
  int32 total = 2;
  int32 pn = 3;
  int32 ps = 4;
}

// --- 名单管理（risk-control 拥有 risk_list 表，写入只能走本服务） ---

message UpsertListEntryReq {
  ListType list_type = 1;
  TargetType target_type = 2;
  string target_value = 3;        // mid 十进制字符串 / device_hash / ip_hash，禁止明文 IP
  string reason = 4;              // 运营内部说明
  int64 operator = 5;             // 必填 >0
  int64 duration_seconds = 6;     // >0 限期；0 永久
  int32 state = 7;                // 0 停用、1 生效
  string idempotency_key = 8;     // 可选，审计用
}

message UpsertListEntryReply {
  ListEntry entry = 1;
  bool created = 2;
}

message ListEntry {
  int64 id = 1;
  ListType list_type = 2;
  TargetType target_type = 3;
  string target_value = 4;
  string reason = 5;
  int64 operator = 6;
  int64 expire_at = 7;            // 0 表示永久
  int32 state = 8;
  int64 ctime = 9;
  int64 mtime = 10;
}

message GetListEntriesReq {
  ListType list_type = 1;         // UNSPECIFIED 表示不过滤
  TargetType target_type = 2;     // UNSPECIFIED 表示不过滤
  string target_value = 3;        // 空表示不过滤
  int32 state = 4;                // -1 不过滤
  int32 pn = 5;
  int32 ps = 6;
}

message GetListEntriesReply {
  repeated ListEntry entries = 1;
  int32 total = 2;
  int32 pn = 3;
  int32 ps = 4;
}

// RiskControl 账号与行为风控服务。
service RiskControl {
  // 同步裁决一次受保护动作（名单 → 处罚 → 规则 → 降级）。
  rpc CheckAction(CheckActionReq) returns (CheckActionReply);
  // 行为上报，写 Redis 滑窗计数供 CheckAction 评估；不做 SPM 广告分析。
  rpc ReportAction(ReportActionReq) returns (ReportActionReply);
  // 查询设备画像。
  rpc GetDeviceProfile(GetDeviceProfileReq) returns (GetDeviceProfileReply);
  // 写入/更新设备画像与设备-账号关联。
  rpc UpsertDeviceProfile(UpsertDeviceProfileReq) returns (UpsertDeviceProfileReply);
  // 运营/审核下发处罚。
  rpc ApplyPunishment(ApplyPunishmentReq) returns (ApplyPunishmentReply);
  // 解除处罚（幂等，已终态返回当前状态）。
  rpc LiftPunishment(LiftPunishmentReq) returns (LiftPunishmentReply);
  // 分页查询处罚。
  rpc ListPunishments(ListPunishmentsReq) returns (ListPunishmentsReply);
  // 新增/更新风控规则（版本递增，operator 必填）。
  rpc UpsertRule(UpsertRuleReq) returns (UpsertRuleReply);
  // 分页查询风控规则。
  rpc ListRules(ListRulesReq) returns (ListRulesReply);
  // 新增/更新名单条目。
  rpc UpsertListEntry(UpsertListEntryReq) returns (UpsertListEntryReply);
  // 分页查询名单条目。
  rpc GetListEntries(GetListEntriesReq) returns (GetListEntriesReply);
}
